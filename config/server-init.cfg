// basic server configuration script
// note that some commands are commented out with //, and need to be uncommented and set to a value to work

// optional specific IP for server to use
// serverip N.N.N.N

// optional specific port for server to use
// serverport 42000

// maximum number of allowed clients
maxclients 8

// authoritative procedural world identity. The server sends this seed to every
// client and persists accepted semantic edits in media/map/<serverworld>/server.diff.
// Do not change the seed for an existing serverworld; incompatible journals are
// rejected instead of silently generating a different base.
serverworld "multiplayer"
serverworldseed 1337

// Authoritative deterministic weather. A seed of 0 follows serverworldseed.
// Clients render clouds, precipitation, and lighting locally from this shared
// seed and cloud wind state. The weather map itself is fixed.
serverweatherseed 0
servercloudwindspeed 16.0
servercloudwindangle 18.0

// Server-owned gameplay mode. Clients cannot override this value.
// 1 = creative, 0 = survival.
creativemode 0

// Survival inventories are stored atomically in
// config/server-inventories/<permanent-player-id>.cfg. Dirty inventories are
// coalesced to this interval (in secs) and are always flushed on disconnect.
inventorysaveinterval 15

// Positions are stored atomically per world and permanent player identity.
// Active players are checkpointed at this interval and flushed on disconnect.
playerstatesaveinterval 15

// Authoritative building, breaking, and enforcement limits. buildreach is the
// creative-mode limit; survival placement and destruction use a four-block reach.
buildreach 160
placementratelimit 12
destructionratelimit 12
survivalbreakmillis 5000
survivalscatterbreakmillis 250
breaktimetolerance 250
breakcancelgrace 250
breaknetworkrange 512

// Server-authoritative dropped items. Render distance is measured in 16-unit
// cubes; pickup distance is always enforced by the server at 24 engine units.
personaldrops 0
droptimeout 300
maxdrop 1024
dynamicentsmaxdistance 64
requireconfirmeditems 1

// Server-owned NPC simulation and interest ranges, measured in 16-unit blocks.
// Client render distances never affect spawning, AI, despawning, or replication.
serversimulationmaxdist 128
// Milliseconds between support-decay random-tick batches. Lower values decay unsupported blocks faster.
serversupportdecaymillis 3000
servernpcmaxdist 256
servernpcsnapshotmillis 100
servernpcdeathtimeout 20000

// Non-malicious desyncs are corrected until this many violations are exceeded.
// The counter resets after the configured quiet interval. Clear malicious
// inventory/action forgery kicks immediately. Repeated kicks ban the permanent
// authenticated player ID.
desynctolerance 4
violationresetinterval 60
identitybankicks 3

// description server shows for the server browser
serverdesc ""

// password required to connect to the server
// generally unnecessary unless you really don't want anyone connecting to your server
// using the serverauth option allows people with an appropriate local authkey to connect regardless
// serverpass ""

// password that allows you to gain admin by "setmaster password_here" 
// local authkeys are more secure than this and should be used instead if possible
// Set this before exposing world administration commands such as /time,
// /worldundo, /worldrevert, /worldrestore, and /worlddiff.
// Players authenticate with /setmaster your_password.
// adminpass ""

// domain to use for local authkeys to the server so people can authenticate by "auth domain_here"
// must be a non-empty string that should be unique to your server to prevent clashes with other servers
// serverauth ""

// optional message of the day to send to players on connect
// servermotd "..."

// controls whether admin privs are necessary to pause a game
// when 1 requires admin (default)
// when 0 only requires master
// restrictpausegame 1
