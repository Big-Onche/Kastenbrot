// Procedural world generation and cube definitions.
//
// One block is one meter. worldgeologyfrequency is the global horizontal scale:
// lower values create broader continents and hills, higher values make a more
// compact world. The default produces adventure-sized continental features,
// while separate detail layers roughen shorelines and elevated relief.

worldreset

worldgeologyfrequency 0.0012
worldmaxcontinentheight 20
worldmaxoceandepth 128

// Multi-octave coast detail perturbs only the narrow land/ocean boundary band.
// Frequency controls horizontal scale; strength is the continental noise offset.
worldcoastdetailfrequency 0.014
worldcoastdetailstrength 0.020

// Coverage values are relative weights. 55/45 requests more ocean than land;
// 30/70 requests a land-heavy world. They need not add up to 100.
worldoceancoverage 55
worldterraincoverage 45

// Relative target percentages for continental relief. Values are normalized,
// so they do not need to add up to 100. Relief zones are nested: every high
// summit is surrounded by mountains, then hills, then plains.
worldplainscoverage 45
worldhillscoverage 32
worldmountainscoverage 18
worldhighsummitscoverage 5

// Fine terrain noise stays subtle on plains, then is amplified by nested hill,
// mountain, summit, and coastal-cliff masks. Frequency controls feature size;
// variation values are vertical metres.
worldterrainmicrofrequency 0.015
worldplainsmicrovariation 0
worldreliefmicrovariation 7

// Structural mountain features. Intersecting ridges produce isolated secondary
// summits. Sparse, bumpy rocky ledges appear only on steep mountain flanks around
// hollows and folds; cluses cut across those folds. Values are vertical metres.
worldsecondarysummitheight 14
worldrockyledgeheight 5
worldclusedepth 9

// Shared tectonic corridors modulate mountains, abyssal trenches, and caves.
// The frequency targets belts roughly 500–1000 meters across.
worldtectonicfrequency 0.0014
worldtectonicwarpamplitude 64
worldtectonicridgepower 2.2
worldtectonicactivitythreshold 0.35
worldmaxlanduplift 160
worldmaxoceansubsidence 100
worldtectoniccavestrength 0.35
worldtectonicfracturestrength 0.40
worldcoastprotectionwidth 32

worldsealevel 0

// Material-only soil thickness: total grass-plus-dirt blocks above stone.
// This does not alter the generated surface height.
worldsoildepth 5

// snow, exposed-stone, coast, sand, and tree rules.
worldtemperaturefrequency 0.0004
worldmoisturefrequency 0.0006
worldbiomevariationfrequency 0.001
worldbiomevariationstrength 0.15
worldrockfrequency 0.08

worldsnowheight 160
worldstonelow 75
worldstonehigh 125
worlddeserttemperature 0.4
worlddesertmoisture -0.18
worldforestmoisture 0.10
worldbiomeblend 16

worldforesttreedensity 0.04
worldplainstreedensity 0.0017
worldpinestartheight 50
worldpinefullheight 100

// Model grass is distributed in broad noise-driven patches. Density scales the
// per-cube placement chance. Offset is measured in blocks (one block is one
// metre) and stays below half a block to remain near centre.
worldgrassfrequency 0.015
worldgrassdensity 0.18
worldgrassmaxoffset 0.22

// Flowers use independent broad noise patches for each species. Chance controls
// their shared rarity; weights are relative and zero disables a species.
worldflowerchance 0.12
worldroseweight 5
worldtulipweight 5
worlddandelionweight 3

worldcoastwidth 20
worldcoastvariation 4
worldbeachminheight -2
worldbeachmaxheight 1
worldcliffchance 24
worldcliffmaxheight 24

// Subterranean generation
worldcavefrequency 0.045
worldcavethreshold 0.58
worldlargecavefrequency 0.018
worldlargecavethreshold 0.76
worldlargecavedeepthreshold 0.58
worldtunnelfrequency 0.025
worldtunnelwidth 0.075
worldcaveentrancewidth 0.05
worldcavemindepth 12
worldcavefulldepth 32
worldcavedeepheight -64

worldbottomlavalayers 3
worldlavalakestartheight -16
worldlavalakedeepheight -64
worldlavalakeshallowchance 0.03
worldlavalakedeepchance 0.22
worldlavalakeminsize 4
worldlavalakemaxsize 14
worldlavalakespacing 24
worldlavalakeshapefrequency 0.08
worldlavalakeshapevariation 0.35

TEX_SIZE = 16 // size of the texture

// stacks sizes
LARGE_STACK = 64
MEDIUM_STACK = 16
SMALL_STACK = 8

// worldcube <id> <item id> <top texture> <texsize> [side texture] [bottom texture]
// worldscatter <id> <item id> <mapmodel path>
// worldplaceable <id> <item id> <mapmodel path> <light radius> [light color]
// worlddrop <world object id> <item id, self, or false> <min> <max> [chance]
// inventoryitem <id> <display name> <max stack> [model path] [icon path]
// worldmining <world object id> <hardness> <preferred tool> <required tier> [tool wear] [hand breakable]
// inventorytool <item id> <tool type> <tier> <speed> <max durability>

// Error placeholders
inventoryitem "error" "Error" $LARGE_STACK
worldscatter "error" "error" "error"
worldplaceable "error" "error" "error"
worldcube "error" "error" "base/error.png" $TEX_SIZE
worldmining "error" 1.0 "" 0 0
worlddrop "error" "self" 1 1

