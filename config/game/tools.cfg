toolfamily "sword" [
    name "Sword"
    icon "item/tools/%material%_sword.png"
    stack 1
    scale 1.35
    speedoffset -0.5
    damagebase 3
    materialdamage 1
    recipepattern ["M" "M" "S"]
]

toolfamily "pickaxe" [
    name "Pickaxe"
    icon "item/tools/%material%_pick.png"
    stack 1
    scale 1.35
    damagebase 2
    recipepattern ["MMM" " S " " S "]
]

toolfamily "axe" [
    name "Axe"
    icon "item/tools/%material%_axe.png"
    stack 1
    scale 1.35
    damagebase 2
    heldflip 1 0
    recipepattern ["MM " "MS " " S "]
    recipemirror 1
]

toolfamily "shovel" [
    name "Shovel"
    icon "item/tools/%material%_shovel.png"
    stack 1
    scale 1.35
    damagebase 2
    cornerpush "right"
    recipepattern ["M" "S" "S"]
]

toolset ["wood" "stone" "iron" "steel" "diamond"]

worlddef "chisel" [
    item [ name "Chisel"; stack 1; icon "item/tools/chisel.png"; scale 1.35 ]
]

worlddef "hammer" [
    item [ name "Hammer"; stack 1; icon "item/tools/hammer.png"; scale 1.35 ]
]

worlddef "hammer_chisel" [
    item [ name "Hammer and Chisel"; stack 1; icon "item/tools/hammer_chisel.png"; scale 1.35 ]
    tool [ type "hammer_chisel"; tier 0; speed 1.0; durability 290; damage 1; cornerpush "right" ]
]
