craftrecipe "sticks" [
    recipetype "shaped"
    recipeoutput "stick" 4
    recipepattern [
        "P"
        "P"
    ]
    recipeingredient "P" "#planks"
]

craftrecipe "torches" [
    recipetype "shaped"
    recipeoutput "torch" 4
    recipepattern [
        "C"
        "S"
    ]
    recipeingredient "C" "#coal"
    recipeingredient "S" "stick"
]

craftrecipe "chisel" [
    recipetype "shaped"
    recipeoutput "chisel" 1
    recipepattern ["  I" " I " "S  "]
    recipeingredient "I" "iron_ingot"
    recipeingredient "S" "stick"
]

craftrecipe "hammer" [
    recipetype "shaped"
    recipeoutput "hammer" 1
    recipepattern [" I " " SI" "S  "]
    recipeingredient "I" "iron_ingot"
    recipeingredient "S" "stick"
]

craftrecipe "hammer_chisel" [
    recipetype "shapeless"
    recipeoutput "hammer_chisel" 1
    recipestation "crafting_table"
    recipeingredient "hammer" 1
    recipeingredient "chisel" 1
]
