// npcdef <id> <name> <model root> <attitude> <behavior> <health> <damage>
//        <speed> <attack interval ms> <wander radius> <aggro distance> <flee distance>
// Distances are measured in blocks and speed is measured in game units per second.
// npcmodel <id> <humanoid|quadruped> <collision radius> <height> <model root height>
// npcnatural <id> <biome> <minimum group> <maximum group> <chance per spawn attempt>
// npccavebands <id> <vertical band count, 0 disables cave spawning, maximum 512>
// Bands divide the full world height; more bands give more group opportunities per column.
// npccavegroup <id> <minimum group> <maximum group>, within 1-4; defaults to 1-4.
// npchitflee <id> <speed multiplier> <herd alert radius> <duration ms>
// npcdrop <id> <item id> <minimum count> <maximum count> <chance>
// npcwandersound <id> <sound prefix relative to media/sound> <variant count> <minimum seconds> <maximum seconds>
// Numbered variants run from 1 to count and share one per-mob timer.
npcreset
npcdef "zombie" "Zombie" "game/npc/zombie" "aggressive" "wandering" 25 2 15 1000 10 16 12
npccavebands "zombie" 16
npcwandersound "zombie" "npc/zombie_wandering_" 3 15 40

npcdef "mossy_skeleton" "Mossy Skeleton" "game/npc/mossy_skeleton" "aggressive" "wandering" 15 3 30 1000 5 16 12
npcmodel "mossy_skeleton" "humanoid" 4.1 30 11.25
npccavebands "mossy_skeleton" 16
npccavegroup "mossy_skeleton" 1 2

npcdef "cow" "Cow" "game/npc/cow" "friendly" "wandering" 30 0 18 1000 10 0 12
npcmodel "cow" "quadruped" 6 25 12
npcwandersound "cow" "npc/cow_wandering_" 3 10 20
npcnatural "cow" "plains" 3 4 0.05
npchitflee "cow" 4.0 12 7000
npcdrop "cow" "leather" 1 2 0.50
npcdrop "cow" "raw_steak" 1 1 0.75

npcdef "pig" "Pig" "game/npc/pig" "friendly" "wandering" 20 0 18 1000 10 0 12
npcmodel "pig" "quadruped" 5 16 6
npcnatural "pig" "plains" 3 4 0.04
npchitflee "pig" 4.0 12 7000

npcdef "deer" "Deer" "game/npc/deer" "neutral" "wandering" 30 4 22 1000 15 16 12
npcmodel "deer" "quadruped" 7.5 46.5 13.5
npcnatural "deer" "forest" 1 1 0.03

npcdef "doe" "Doe" "game/npc/doe" "scared" "wandering" 15 0 50 1000 15 0 12
npcmodel "doe" "quadruped" 5 24 9
npcnatural "doe" "forest" 1 1 0.03
npchitflee "doe" 2.5 0 7000
