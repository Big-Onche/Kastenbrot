// Worn-slot IDs are stable data identifiers. The final flag marks a mirrored
// display slot; mirrored slots never own a separate item instance.
wornslot "head" "HEAD" 0
wornslot "scroll" "SCROLL" 0
wornslot "neck" "NECK" 0
wornslot "back" "BACK" 0
wornslot "weapon" "WEAPON" 1
wornslot "body" "BODY" 0
wornslot "offhand" "OFFHAND" 0
wornslot "gloves" "GLOVES" 0
wornslot "legs" "LEGS" 0
wornslot "feet" "FEET" 0
wornslot "ring" "RING" 0

worlddef "backpack" [
    item [ name "Backpack"; stack 1; icon "item/equipement/backpack.png" ]
    equipment [ slots "back"; inventoryslots 9 ]
]

worlddef "ultimate_backpack" [
    item [ name "Ultimate Backpack"; stack 1; icon "item/equipement/ultimate_backpack.png" ]
    equipment [ slots "back"; inventoryslots 18 ]
]
