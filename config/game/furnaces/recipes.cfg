furnacerecipe "iron_ingot" [
    furnaceoutput "iron_ingot" 1
    furnacetime 8
    furnaceingredient "iron_lump" 1
]

furnacerecipe "steel_ingot" [
    furnaceoutput "steel_ingot" 1
    furnacetime 12
    furnaceingredient "iron_ingot" 3
    furnaceingredient "#coal" 3
]

furnacerecipe "bronze_ingot" [
    furnaceoutput "bronze_ingot" 1
    furnacetime 10
    furnaceingredient "copper_lump" 1
    furnaceingredient "tin_lump" 1
]

furnacerecipe "charcoal" [
    furnaceoutput "charcoal" 1
    furnacetime 8
    furnaceingredient "wood" 1
]

furnacerecipe "stone" [
    furnaceoutput "stone" 1
    furnacetime 8
    furnaceingredient "cobblestone" 1
]
