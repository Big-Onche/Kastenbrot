// mining sound <sample prefix> <variant count> uses paths relative to media/sound/game; plays every 200 ms.
// cube footstep <sample prefix> <variant count> plays prefix1.ogg through prefixN.ogg; omitted blocks are silent.
// Every content object is one worlddef with optional capability components.
// held [ flip <x> <y>; size <percent> ] controls its first- and third-person held rendering.

worlddef "error" [
    item [ name "Error"; stack $LARGE_STACK ]
    cube [ texture "base/error.png"; texsize $TEX_SIZE ]
    scatter [ model "error" ]
    placeable [ model "error" ]
    mining [ hardness 1.0; wear 0 ]
    drop "self" 1 1
]

worlddef "grass" [
    item [ name "Grass"; stack $LARGE_STACK ]
    cube [
        texture "terrain/grass.png"; side "terrain/grass_dirt.png"; bottom "terrain/dirt.png"; texsize $TEX_SIZE
        footstep "footstep/grass_" 4
    ]
    mining [ hardness 1.2; tool "shovel"; tier 0; wear 1; sound "mine/grass_" 4 ]
    drop "self" 1 1
]

