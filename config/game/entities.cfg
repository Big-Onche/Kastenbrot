worlddef "wood_chest" [
    item [ name "Wood Chest"; stack $LARGE_STACK ]
    placeable [ model "game/chest/wood" ]
    mining [ hardness 3.0; tool "axe"; tier 0; wear 1 ]
    chest [ slots 18 ]
    drop "self" 1 1
]

worlddef "iron_chest" [
    item [ name "Iron Chest"; stack $LARGE_STACK ]
    placeable [ model "game/chest/iron" ]
    mining [ hardness 5.0; tool "pickaxe"; tier 1; wear 1 ]
    chest [ slots 27 ]
    drop "self" 1 1
]

