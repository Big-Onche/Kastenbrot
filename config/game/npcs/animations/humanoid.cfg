// Rotations are degrees; height offsets and travel are game units.
npcanimdef "humanoid_idle" [ rig "humanoid" ]

npcanimdef "humanoid_walk" [
    rig "humanoid"
    travel 0.75; travelheight 1; fullspeed 2.25
    leftarm [ wave "sin"; amplitude -28 ]
    rightarm [ wave "sin"; amplitude 28 ]
    leftleg [ wave "sin"; amplitude 32 ]
    rightleg [ wave "sin"; amplitude -32 ]
    height [ wave "abscos"; amplitude 0.45 ]
]

npcanimdef "humanoid_attack" [
    rig "humanoid"; duration 300
    leftarm [ wave "sin"; frequency 0.5; amplitude 75 ]
    rightarm [ wave "sin"; frequency 0.5; amplitude 75 ]
]

npcanimdef "humanoid_limp" [
    rig "humanoid"; travel 10; travelheight 0
    torsoroll [ wave "abssin"; base 5.2; amplitude 2.8; mirror 1 ]
    height [ wave "abssin"; amplitude 0.9; movement 1 ]
    leftleg [ mode "multiply"; base 0.75 ]
    rightleg [ mode "multiply"; base 0.75 ]
]

npcanimdef "humanoid_crawl" [
    rig "humanoid"; transition 350; travel 7; travelheight 0
    torsopitch [ mode "set"; base -90 ]
    head [ mode "set"; base -30 ]
    height [ mode "set"; base 2.25 ]
    height [ wave "abssin"; frequency 2; amplitude 0.3; movement 1 ]
    leftarm [ mode "set"; base 110; wave "sin"; amplitude 35; amplitudemovement 1; min 90; max 140 ]
    rightarm [ mode "set"; base 110; wave "sin"; amplitude -35; amplitudemovement 1; min 90; max 140 ]
]

// Reusable raised-arm variants; there is no NPC-ID-specific animation logic.
npcanimdef "zombie_idle" [
    rig "humanoid"
    leftarm [ base 80 ]
    rightarm [ base 80 ]
]

npcanimdef "zombie_walk" [
    rig "humanoid"; travel 0.75; travelheight 1; fullspeed 2.25
    leftarm [ wave "sin"; amplitude -6 ]
    rightarm [ wave "sin"; amplitude 6 ]
    leftleg [ wave "sin"; amplitude 32 ]
    rightleg [ wave "sin"; amplitude -32 ]
    height [ wave "abscos"; amplitude 0.45 ]
]

npcanimdef "zombie_attack" [
    rig "humanoid"; duration 300
    leftarm [ mode "set"; base 132; wave "pulse"; peak 0.35; envelope 1 ]
    rightarm [ mode "set"; base 132; wave "pulse"; peak 0.35; envelope 1 ]
]
