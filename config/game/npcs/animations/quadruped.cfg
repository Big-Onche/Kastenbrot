npcanimdef "quadruped_idle" [ rig "quadruped" ]

npcanimdef "quadruped_walk" [
    rig "quadruped"; travel 0.75; travelheight 1; fullspeed 2.25
    leftfront [ wave "sin"; amplitude 33 ]
    rightfront [ wave "sin"; amplitude -33 ]
    leftrear [ wave "sin"; amplitude -33 ]
    rightrear [ wave "sin"; amplitude 33 ]
    height [ wave "abscos"; amplitude 0.25 ]
]

// Rise over the rear hips, hold the hind legs planted, then strike with both front legs.
npcanimdef "quadruped_attack" [
    rig "quadruped"; duration 750
    torsopitch [ amplitude 60; key 0 0; key 0.25 1; key 0.65 1; key 1 0 ]
    rearanchor [ amplitude 1; key 0 0; key 0.25 1; key 0.65 1; key 1 0 ]
    leftrear [ mode "multiply"; base 0; envelope 1; key 0 0; key 0.25 1; key 0.65 1; key 1 0 ]
    rightrear [ mode "multiply"; base 0; envelope 1; key 0 0; key 0.25 1; key 0.65 1; key 1 0 ]
    leftfront [ mode "multiply"; base 0; envelope 1; key 0 0; key 0.25 1; key 0.65 1; key 1 0 ]
    rightfront [ mode "multiply"; base 0; envelope 1; key 0 0; key 0.25 1; key 0.65 1; key 1 0 ]
    leftfront [ amplitude 105; key 0 0; key 0.25 0.3; key 0.45 1; key 0.65 0.8; key 1 0 ]
    rightfront [ amplitude 105; key 0 0; key 0.25 0.3; key 0.45 1; key 0.65 0.8; key 1 0 ]
]

npcanimdef "quadruped_limp" [
    rig "quadruped"; travel 0.75; travelheight 1
    torsoroll [ base 4; mirror 1; movement 1 ]
]

npcanimdef "quadruped_crawl" [
    rig "quadruped"; transition 350; travel 7; travelheight 0
    torsopitch [ mode "set"; base -90 ]
    head [ mode "set"; base -30 ]
    height [ mode "set"; base 2.25 ]
    height [ wave "abssin"; frequency 2; amplitude 0.3; movement 1 ]
    leftfront [ mode "set"; base 110; wave "sin"; amplitude 35; amplitudemovement 1; min 90; max 140 ]
    rightfront [ mode "set"; base 110; wave "sin"; amplitude -35; amplitudemovement 1; min 90; max 140 ]
]
