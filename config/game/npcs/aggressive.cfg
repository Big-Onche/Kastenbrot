npcdef "zombie" [
    animations [
        idle "zombie_idle"; walk "zombie_walk"; attack "zombie_attack"
        limp "humanoid_limp"; crawl "humanoid_crawl"
    ]
    name "Zombie"
    attitude "aggressive"; behavior "wandering"
    weight 1
    health 25; damage 2; attackmillis 1000
    speed 15; wanderradius 10; aggrodist 16; fleedist 12
    model [ path "game/npc/zombie" ]
    caves [ bands 32 ]
    wandersound [ prefix "npc/zombie_wandering_"; variants 3; interval 15 40 ]
]

