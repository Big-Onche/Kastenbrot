///////////////////////////////////////////////////////////////////////////////
menu_entity = [toggleui "addentity"]
// menu_entity = [if (enthavesel) [toggleui "editentity"] [toggleui "addentity"]]

UImenu "editentity" [
    uifill 0.5 0.5 [
        UIbutton "" [uitext "ToDo" 0.8] 0.3 0.2 [hidetopui]
    ]
] [] [] [] "Edit Entity"

UImenu "addentity" [
    uispace 0.008 0.015 [
        uivlist 0 [
            uifill 0.5 0.032 [
                uitext (concatword "^fc5CD/newent " $UI_enttype) 0.7
                uialign* -1 0
                uioutline $c_line ; uiclamp- 1 1 1 1
            ]
            uifill 0 0.025
            uihlist 0.005 [
                uivlist 0.005 [
                    UIbutton "" [uitext "Light" 0.6]     0.2 0.04 [hideui "addentity" ; showui "ent_light"]     -1 [uihover [UI_enttype = "light ^fc888*"]]
                    UIbutton "" [uitext "Spotlight" 0.6] 0.2 0.04 [hideui "addentity" ; showui "ent_spotlight"] -1 [uihover [UI_enttype = "spotlight ^fc888*"]]
                    UIbutton "" [uitext "Envmap" 0.6]    0.2 0.04 [hideui "addentity" ; newent envmap]          -1 [uihover [UI_enttype = "envmap"]]
                ]
                uivlist 0.005 [
                    UIbutton "" [uitext "Mapmodel" 0.6; UI_keyref 2 0.027 0.027 "F3"]  0.2 0.04 [hideui "addentity"; showui "mapmodel"]     -1 [uihover [UI_enttype = "mapmodel ^fc888*"]]
                    UIbutton "" [uitext "Particles" 0.6] 0.2 0.04 [hideui "addentity" ; showui "ent_particles"] -1 [uihover [UI_enttype = "particles ^fc888*"]]
                    UIbutton "" [uitext "Jumppad" 0.6]   0.2 0.04 [hideui "addentity" ; showui "ent_jumppad"]   -1 [uihover [UI_enttype = "jumppad ^fc888*"]]
                    UIbutton "" [uitext "Teleport" 0.6]  0.2 0.04 [hideui "addentity" ; showui "ent_teleport"]  -1 [uihover [UI_enttype = "teleport ^fc888*"]]
                    UIbutton "" [uitext "Teledest" 0.6]  0.2 0.04 [hideui "addentity" ; showui "ent_teledest"]  -1 [uihover [UI_enttype = "teledest ^fc888*"]]
                ]
                uivlist 0.005 [
                    UIbutton "" [uitext "Playerstart" 0.6]         0.2 0.04 [hideui "addentity" ; newent playerstart]   -1 [uihover [UI_enttype = "playerstart"]]
                ]
                uialign* -1 -1
            ]
            uifill 0 0.01
            UIbutton "hold2" [
                UIcheckbox $entselsnap 0.016
                uitext "Entity Snapping" 0.6
                UI_keyref 2 0.027 0.027 "7"
            ] 0.25 0.04 [entselsnap (! $entselsnap)]
        ]
    ]
] [
    UI_enttype = " "
    looplist a ["editentity" "ent_light" "ent_spotlight" "ent_jumppad" "mapmodel" "ent_particles" "ent_teleport" "ent_teledest"] [hideui $a]
] [] [] "Add Entity"

UI_lts = 128
