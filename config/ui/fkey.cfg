                            UIbutton "" [uitext "Sky" 0.8] 0.25 0.1 [hidetopui]
                        ]
                    ] 2 [//Dynamic-Sky//////////////////////////////////////////////////////////////////
                        uitablerow [
                            UIbutton "" [uitext "Dynamic-Sky" 0.8] 0.25 0.1 [hidetopui]
                        ]
                    ] 3 [//Fog//////////////////////////////////////////////////////////////////////////
                        uitablerow [
                            UIbutton "" [uitext "Fog" 0.8] 0.25 0.1 [hidetopui]
