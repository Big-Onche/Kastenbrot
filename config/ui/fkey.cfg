            5 "Lava"     []
            6 "Glass"    []
        ] 1
        uialign- 0 -1
        UIbar 0 1
        uifill 0.02
        uiscroll 0.67 0.6 [
            uifill 0.67 0.6 [
                uialign 0 -1
                uitable 0 0 [
                    uialign -1 -1
                    case $UI_envtabs 0 [//Lighting//////////////////////////////////////////////////////
                        uitablerow [
                            UIbutton "" [uitext "Lighting" 0.8] 0.25 0.1 [hidetopui]
                        ]
                    ] 1 [//Sky//////////////////////////////////////////////////////////////////////////
