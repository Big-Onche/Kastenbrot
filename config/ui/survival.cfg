UI_furnace_progress = [
    local progress
    progress = (getfurnaceprogress)
    uifill 0.271 0.016 [
        uihlist 0 [
            uicolor 0xFFE7B94A (*f 0.271 $progress) 0.016
            uicolor 0xD0181818 (*f 0.271 (-f 1 $progress)) 0.016
        ]
        uioutline 0xFF777777
    ]
]

UI_furnace_heat = [
    local heatratio
    heatratio = (getfurnaceheatratio)
    uifill 0.064 0.010 [
        uihlist 0 [
            uicolor 0xFFFF7020 (*f 0.064 $heatratio) 0.010
            uicolor 0xD0181818 (*f 0.064 (-f 1 $heatratio)) 0.010
        ]
        uioutline 0xFF704020
    ]
]

UI_crafting_grid = [
    uihlist 0.014 [
        uigrid $arg1 0.005 0.005 [
            loop i (* $arg1 $arg1) [UI_crafting_slot $i $arg2]
        ]
        uitext "→" 0.7
        UI_crafting_output $arg2
    ]
]

UI_survival_hotbar = [
    uihlist 0.005 [
        loop i 9 [
            UI_survival_slot $i $arg1
        ]
    ]
]

UI_survival_locked_slot = [
    uifill $arg1 $arg1 [
        uicolor 0xE0181818 $arg1 $arg1
        uioutline 0xFF444444
        uiclamp* 1 1 1 1
        uitext "X" 0.52
    ]
]

newui "survival_hotbar" [
    uiallowinput (&& (survivalactive) (uivisible "survival_inventory"))
    uieschide 0
    if (|| $mainmenu $hidehud $editing (! (survivalactive))) [] [
        uialign 0 1
        uispace 0 0.018 [
            UI_survival_hotbar 0.064
        ]
    ]
]

newui "survival_drag_preview" [
    uiallowinput 0
    uieschide 0
    if (&& (|| (uivisible "survival_inventory") (uivisible "crafting_table") (uivisible "furnace")) (>= (getinventorycursoritem) 0)) [
        uialign -1 -1
        local item
        local count
        item = (getinventorycursoritem)
        count = (getinventorycursorcount)
        uioffset (-f (uicursorx 0.029) 0.029) (-f (uicursory 0.029) 0.029) [
            UI_survival_item_preview $item 0.058 [
                uiclamp- 1 1 1 1
                uifill 0.058 0.058 [
                    uialign 1 1
                    uispace 0.004 0.002 [uitext $count 0.55 ; uialign 1 1]
                ]
            ]
        ]
    ]
]

UImenu "survival_inventory" [
    uieschide 0
    if (! (survivalactive)) [
        hideui "survival_inventory"
    ] [
        uivlist 0.014 [
            UI_crafting_grid 2 0.064
            uiline $c_line
            uivlist 0.004 [
                uitext "Survival inventory" 0.75
                uigrid 9 0.005 0.005 [
                    loop i 18 [
                        UI_survival_locked_slot 0.064
                    ]
                ]
                uihlist 0.005 [
                    loop i 9 [
                        UI_survival_slot (+ $i 9) 0.064
                    ]
                ]
            ]
            uiline $c_line
            UI_survival_hotbar 0.064
        ]
    ]
] [
    opencraftinginventory
    showui "survival_drag_preview"
] [
    hideui "survival_drag_preview"
] [] "Inventory"

UImenu "crafting_table" [
    uieschide 0
    if (! (survivalactive)) [
        hideui "crafting_table"
    ] [
        uivlist 0.014 [
            UI_crafting_grid 3 0.064
            uiline $c_line
            uihlist 0.005 [
                loop i 9 [UI_survival_slot (+ $i 9) 0.064]
            ]
            UI_survival_hotbar 0.064
        ]
    ]
] [
    showui "survival_drag_preview"
] [
    hideui "survival_drag_preview"
] [] "Crafting Table"

UImenu "furnace" [
    uieschide 0
    if (! (survivalactive)) [
        hideui "furnace"
    ] [
        uivlist 0.014 [
            uihlist 0.018 [
                uivlist 0.008 [
                    uihlist 0.005 [
                        loop i (getfurnaceinputslots) [UI_furnace_input_slot $i 0.064]
                    ]
                    UI_furnace_progress
                    UIbutton (? (getfurnacebaking) "hold2" "") [
                        uitext (? (getfurnacebaking) "Baking..." "Bake") 0.52
                    ] 0.100 0.034 [bakefurnace]
                ]
                uivlist 0.005 [
                    uitext "Fuel" 0.52
                    UI_furnace_fuel_slot 0.064
                    UI_furnace_heat
                    uitext (format "%1 s" (getfurnaceheat)) 0.46
                ]
                uitext "->" 0.7
                UI_furnace_output_slot 0.064
            ]
            uiline $c_line
            uihlist 0.005 [
                loop i 9 [UI_survival_slot (+ $i 9) 0.064]
            ]
            UI_survival_hotbar 0.064
        ]
    ]
] [
    showui "survival_drag_preview"
] [
    closefurnace
    hideui "survival_drag_preview"
] [] "Furnace"
