///////////////////////////////////////////////////////////////////////////////
//  Main                                                                     //
///////////////////////////////////////////////////////////////////////////////

UImenu "main" [
    uieschide (! $mainmenu)
    uihlist 0 [
        uivlist 0.0037 [
            if $mainmenu [
                UIbutton "hold2" [uitext "Singleplayer" 0.65] 0.2 0.04 [hideui "main" ; showui "singleplayer"]
                UIbutton "hold2" [uitext "Multiplayer" 0.65] 0.2 0.04 [hideui "main" ; showui "server_browser"]
                UIbutton "hold2" [uitext "Credits" 0.65] 0.2 0.04 [hideui "main" ; showui "credits"]
            
                uifill 0.2 0.02 [UIbar 1]
            ]
            
            uihlist 0.0037 [
                UIbutton "hold2" [uitext "Options" 0.65] 0.2 0.04 [hideui "main" ; showui "options"]
                if $mainmenu [
                    UIbutton "hold2" [uitext "Quit" 0.65] 0.2 0.04 [quit]
                ] [
                    UIbutton "hold2" [uitext "Disconnect" 0.65] 0.2 0.04 [saveworld ; disconnect]
                ]
            ]
        ]
    ]
]