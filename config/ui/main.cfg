///////////////////////////////////////////////////////////////////////////////
//  Main                                                                     //
///////////////////////////////////////////////////////////////////////////////

// UI_main_button 1:(TEXT) 2:[ACTION] 3:(TOOLTIP-TEXT)
UI_main_button = [
    UIbutton "hold2" [
        uitext $arg1 $s_main

        if (> $numargs 2) [
            uitooltip $arg3 $s_tooltip $t_tooltip
        ]
    ] 0.2 0.04 $arg2
]

UImenu "main" [
    uieschide (! $mainmenu)

    uihlist 0 [
        uivlist 0.0037 [
            if $mainmenu [
                UI_main_button "Singleplayer" [hideui "main" ; showui "singleplayer"] "Play offline and forever alone."
                UI_main_button "Multiplayer" [hideui "main" ; showui "server_browser"] "Play online with your friends and enemies."
                UI_main_button "Credits" [hideui "main" ; showui "credits"] "Who's behind this shit?"

                uifill 0.4 0.02 [UIbar 1] // ----------------------------------------------------------------
            ]

            uihlist 0.0037 [
                UI_main_button "Options" [hideui "main" ; showui "options"] "Reduce or increase the lag here."

                if $mainmenu [
                    UI_main_button "Quit" [quit] "It's time to touch some real grass!"
                ] [
                    UI_main_button "Disconnect" [saveworld ; disconnect] "A successful save of your world is not guaranteed."
                ]
            ]
        ]
    ]
]
