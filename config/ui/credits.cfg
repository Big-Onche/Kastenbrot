///////////////////////////////////////////////////////////////////////////////
//  Credits                                                                  //
///////////////////////////////////////////////////////////////////////////////
UI_creditlist = [
    UItitle [
        uispace 0.015 0 [
            uialign -1 -2
            uihlist 0.01 [
                uiimage "media/interface/cube.png" 0.03 0.03
                uitext [@@@@arg1] 0.7
            ]
        ]
    ] 0 0.032
    uispace 0.03 0 [
        uifill 0 0 [
            uiclamp 1 1
            uimodhgradient 0xC0C0C0 0xFFFFFF
            uiclamp- 1 1 1 1
            uispace 0.02 0.01 [
                uialign -1 -2
                uivlist 0 [
                    looplist i $arg2 [
                        uiwraptext (strreplace (strreplace $i "^"" "^fs^f8^"" "^"^fr") ": " "^f4: ") 0.69 0.6
                    ]
                    uialign* -1 -2
                ]
            ]
        ]
    ]
    uifill 0 0.02
]

UImenu "credits" [
    uihlist 0.01 [
        uiscroll 0.8 0.8 [
            uifill 0.77
            uivlist 0.0008 [
                uiclamp 1 1
                uialign -2 -1
                // Alphabetized by alias
                UI_creditlist "Kastenbrot" [
                    [Jean "BIG-Onche" Onche : Code, game design, textures]
                    [Joe Enderman : Textures, sprites]
                    [Kevin "Hirato Kirata" Meyer]
                ]
                UI_creditlist "Code" [
                    [Lee "eihrul" Salzman]
                    [Benjamin Segovia]
                    [Kevin "Hirato Kirata" Meyer]
                ]
                UI_creditlist "Art" [
                    [Shane "Nieb" Nieb : Textures]
                    ["Jeti" Font]

                ]
                UI_creditlist "Miscellaneous" [
                    [Kevin "Hirato Kirata" Meyer : CubeScript Documentation]
                    [Shane "Nieb" Nieb : UI Design]
                    [Daniel "q66" Kolesa : Build-system Improvements]
                    ["RaZgRiZ" : UI Documentation, UI Design]
                ]
                UI_creditlist "Cube Engine 2" [
                    [Wouter "Aardappel" van Oortmerssen]
                    [Lee "eihrul" Salzman]
                    [Mike "Gilt" Dysart]
                    [Robert "baby-rabbit" Pointon]
                    [Quinton "Quin" Reeves]
                    [John "geartrooper" Siar]
                    [and others...]
                    "http://sauerbraten.org/"
                ]
                UI_creditlist "Licenses" [
                    [Licenses for third-party assets are included in their respective "info.txt" files.]
                    [Kastenbrot logo, icon, and branding: (c) 2026 BIG-Onche. All Rights Reserved.]
                ]
                uiclamp* 1 1
            ]
        ]
        UIvscroll 0.02 0.8 2.0
    ]
] [] [] [] "Kastenbrot Contributors"
