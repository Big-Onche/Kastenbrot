///////////////////////////////////////////////////////////////////////////////
//  Singleplayer                                                             //
///////////////////////////////////////////////////////////////////////////////

UI_worldname = "new_world"
UI_worlds = ""
UI_gamemode = 0

UI_refreshworlds = [
    UI_worlds = ""
    loopfiles world "media/map" "" [
        if (|| (findfile (concatword "media/map/" $world "/world.meta")) (findfile (concatword "media/map/" $world "/0_0.ogz"))) [
            UI_worlds = (concat $UI_worlds (escape $world))
        ]
    ]
]

UImenu "singleplayer" [
    uivlist 0.01 [
        uihlist 0.01 [
            uiscroll 0.37 0.5 [
                uifill 0.37 0.5 [
                    uivlist 0 [
                        uialign 0 -1
                        uiclamp 1 1
                        if (=s $UI_worlds "") [
                            uifill 0.37 0.05 [
                                uitext "No saved worlds found" 0.6
                            ]
                        ] [
                            looplist world $UI_worlds [
                                UIbutton "hold2" [
                                    uitext $world 0.6
                                ] 0.37 0.04 [
                                    hideui "load_world"
                                    hideui "creative_inventory"
                                    hideui "survival_inventory"
                                    // Capture this iteration's name now. Using
                                    // $world here resolves the loop variable
                                    // when the button is clicked, after the
                                    // loop has advanced to its final entry.
                                    loadworld @world
                                ] -1
                            ]
                        ]
                        uiclamp* 1 1
                    ]
                ]
            ]
            UIvscroll 0.02 0.5 1.25
        ]
        uihlist 0.01 [
            UIbutton "hold2" [uitext "Refresh" 0.6] 0.18 0.04 [UI_refreshworlds]
            UIbutton "hold2" [uitext "Back" 0.6] 0.18 0.04 [hideui "singleplayer" ; showui "main"]
        ]
        
        uifill 0.2 0.02 [UIbar 1]
        
        UIbutton "hold2" [uitext "Create new world" 0.65] 0.2 0.04 [hideui "singleplayer" ; showui "new_world"]
        
    ]
] [UI_refreshworlds] [] [] "Load World"

UImenu "new_world" [
    uivlist 0.0037 [
        uitext "World name" 0.65
        uifield UI_worldname 20 [] 0.6 style_generic_focus
        
        uifill 0.2 0.02 [UIbar 1]
        
        uitext "World seed" 0.65
        uifield worldseed 20 [] 0.6 style_generic_focus
        uitext "Game mode" 0.55
        UIlistslider UI_gamemode  = [0 "Creative" 2 "Survival"] 0.3 $UI_optrowh

        if (= $UI_gamemode 0) [
            uitext "Instant breaking and unlimited building." 0.4
        ] [
            uitext "Gather resources, craft items, and survive." 0.4
        ]
                    
        uifill 0.2 0.02 [UIbar 1]
                    
        UIbutton "hold2" [uitext "Create new world" 0.65] 0.2 0.04 [mode $UI_gamemode ; newworld $UI_worldname]
    ]
] [] [] [] "New World"
