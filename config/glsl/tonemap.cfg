////////////////////////////////////////////////
//
// tonemapping
//
////////////////////////////////////////////////

shader 0 "hdrreduce" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0; 
    }
] [
    uniform sampler2DRect tex0; 
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor.rgb = texture2DRect(tex0, texcoord0).rgb;
    }
]

shader 0 "hdrreduce2w" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    uniform sampler2DRect tex0; 
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor.rgb = 0.5*(texture2DRectOffset(tex0, texcoord0, ivec2(-1, 0)).rgb + texture2DRectOffset(tex0, texcoord0, ivec2(1, 0)).rgb);
    }
]

shader 0 "hdrreduce2" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    uniform sampler2DRect tex0; 
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor.rgb = 0.25*(texture2DRectOffset(tex0, texcoord0, ivec2(-1, -1)).rgb + texture2DRectOffset(tex0, texcoord0, ivec2(1, -1)).rgb +
                              texture2DRectOffset(tex0, texcoord0, ivec2(1, 1)).rgb + texture2DRectOffset(tex0, texcoord0, ivec2(-1, 1)).rgb);
    }
]

lazyshader 0 msaaresolve [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DMS tex0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = texelFetch(tex0, ivec2(gl_FragCoord.xy), 0);
    }
]

lazyshader 0 msaaresolvedepth [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DMS tex0;
    @(if $gdepthformat [result [
        @(gdepthunpackparams)
        uniform vec2 gdepthinvscale;
        fragdata(0) vec4 fragcolor;
    ]])
    void main(void)
    {
        @(if $gdepthformat [result [
            vec4 packdepth = texelFetch(tex0, ivec2(gl_FragCoord.xy), 0);
            @(gdepthunpack depth packdepth)
            fragcolor = packdepth;
            gl_FragDepth = gdepthinvscale.x / depth - gdepthinvscale.y;
        ]] [result [
            gl_FragDepth = texelFetch(tex0, ivec2(gl_FragCoord.xy), 0).r;
        ]])
    }
]

lazyshader 0 msaareducew [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 tap0, tap1;
    void main(void)
    {
        gl_Position = vvertex;
        tap0 = vtexcoord0; 
        tap1 = vtexcoord0 + vec2(-1.0, 0.0);
    }
] [
    uniform sampler2DMS tex0; 
    varying vec2 tap0, tap1;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = 0.5*(texelFetch(tex0, ivec2(tap0), 0) + texelFetch(tex0, ivec2(tap1), 0));
    }
]

lazyshader 0 msaareduce [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 tap0, tap1, tap2, tap3;
    void main(void)
    {
        gl_Position = vvertex;
        tap0 = vtexcoord0; 
        tap1 = vtexcoord0 + vec2(-1.0,  0.0);
        tap2 = vtexcoord0 + vec2( 0.0, -1.0);
        tap3 = vtexcoord0 + vec2(-1.0, -1.0);
    }
] [
    uniform sampler2DMS tex0; 
    varying vec2 tap0, tap1, tap2, tap3;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = 0.25*(texelFetch(tex0, ivec2(tap0), 0) + texelFetch(tex0, ivec2(tap1), 0) +
                          texelFetch(tex0, ivec2(tap2), 0) + texelFetch(tex0, ivec2(tap3), 0));
    }
]

lumweights = "0.2126, 0.7152, 0.0722"
//lumweights = "0.299, 0.587, 0.114"

hdrgammadecode = [
    if (=f $hdrgamma 2) [result [
        @arg1 *= @arg1;
    ]] [result [
        @arg1 = pow(@arg1, vec3(hdrgamma.x));
    ]]
]

hdrgammaencode = [
    if (=f $hdrgamma 2) [result [
        @arg1 = sqrt(@arg1);
    ]] [result [
        @arg1 = pow(@arg1, vec3(hdrgamma.y));
    ]]
]

shader 0 "hdrluminance" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0; 
    }
] [
    uniform sampler2DRect tex0; 
    uniform vec2 hdrgamma;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec3 color = texture2DRect(tex0, texcoord0).rgb*2.0;
        @(hdrgammadecode color)
        float lum = dot(color, vec3(@lumweights));
        float loglum = sqrt(clamp(lum, 0.015625, 4.0)) * (1.0/2.0); // allow values as low as 2^-6, and as high 2^2
        fragcolor.rgb = vec3(loglum);
    }
]

shader 0 "hdrluminance2w" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    uniform sampler2DRect tex0; 
    uniform vec2 hdrgamma;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        @(loopconcat i 2 [result [
            vec3 color@[i] = texture2DRectOffset(tex0, texcoord0, ivec2(@(at ["-1, 0" "1, 0"] $i))).rgb*2.0;
            @(hdrgammadecode [color@[i]])
            float lum@[i] = dot(color@[i], vec3(@lumweights));
            float loglum@[i] = sqrt(clamp(lum@[i], 0.015625, 4.0)) * (1.0/2.0);
        ]])
        fragcolor.rgb = vec3(0.5*(loglum0 + loglum1));
    }
]

shader 0 "hdrluminance2" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    uniform sampler2DRect tex0; 
    uniform vec2 hdrgamma;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        @(loopconcat i 4 [result [
            vec3 color@[i] = texture2DRectOffset(tex0, texcoord0, ivec2(@(at ["-1, -1" "1, -1" "1, 1" "-1, 1"] $i))).rgb*2.0;
            @(hdrgammadecode [color@[i]])
            float lum@[i] = dot(color@[i], vec3(@lumweights));
            float loglum@[i] = sqrt(clamp(lum@[i], 0.015625, 4.0)) * (1.0/2.0);
        ]])
        fragcolor.rgb = vec3(0.25*(loglum0 + loglum1 + loglum2 + loglum3));
    }
]

shader 0 "hdraccum" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0;
    uniform float accumscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        float lum = texture2DRect(tex0, vec2(0.5, 0.5)).r * 2.0;
        lum *= lum;
        fragcolor = vec4(vec3(lum*0.25), accumscale);
    }
]

shader 0 "hdrbloom" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    @(? (>= $hwvtexunits 4) [
        uniform sampler2D tex2;
    ] [
        attribute float vcolor;
    ])
    uniform vec4 hdrparams;
    varying vec2 texcoord0;
    flat varying float lumscale, lumthreshold;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0; 
        float avglum = 4.0 * @(? (>= $hwvtexunits 4) [texture2D(tex2, vec2(0.5, 0.5)).r] [vcolor]);
        lumscale = hdrparams.x * -log2(1.0 - clamp(avglum, @hdrminexposure, @hdrmaxexposure))/(avglum + 1e-4);
        lumthreshold = -log2(1.0 - hdrparams.z);
    }
] [
    uniform sampler2DRect tex0; 
    uniform vec2 hdrgamma;
    varying vec2 texcoord0;
    flat varying float lumscale, lumthreshold;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec3 color = texture2DRect(tex0, texcoord0).rgb*2.0;
        @(hdrgammadecode color)
        float lum = dot(color, vec3(@lumweights));
        color *= max(lum*lumscale - lumthreshold, 0.0) / (lum + 1e-4);
        @(hdrgammaencode color)
        fragcolor.rgb = color;
    }
]

hdrtonemapvertexshader = [
  result [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    @(screentexcoord 1)
    @(? (>= $hwvtexunits 4) [
        uniform sampler2D tex2;
    ] [
        attribute float vcolor;
    ])
    uniform vec4 hdrparams;
    varying vec2 texcoord0, texcoord1;
    flat varying float lumscale;
    flat varying vec2 lumsaturate;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0; 
        texcoord1 = vtexcoord1;
        float avglum = 4.0 * @(? (>= $hwvtexunits 4) [texture2D(tex2, vec2(0.5, 0.5)).r] [vcolor]);
        lumscale = hdrparams.x * -log2(1.0 - clamp(avglum, @hdrminexposure, @hdrmaxexposure))/(avglum + 1e-4);
        lumsaturate = vec2(1.0, -hdrparams.y) / max(1.0 - hdrparams.y, 1e-4f);
    }
  ]
]

hdrtonemapfrag = [
    result [{
        // color = 1.0 - exp2(-color*lumscale);
        float lum = dot(@arg1, vec3(@lumweights)), target = 1.0 - exp2(-lum*lumscale), excess = lum * max(target*lumsaturate.x + lumsaturate.y, 0.0);
        @arg1 = (@arg1 + excess) * target / (lum + excess + 1e-4);
        applyBiomeGrade(@arg1);
    }]
]

biomelutdefs = [
    result [
        uniform vec4 biomegrade;
        uniform vec2 biomelutparams;

        struct BiomeGrade
        {
            vec3 shadows, midtones, highlights;
            float saturation, contrast, exposure;
        };

        BiomeGrade getBiomeGrade(int biome)
        {
            // 0 = OCEAN
            if(biome == 0) return BiomeGrade(
                vec3(0.90, 0.98, 1.10),   // shadows
                vec3(0.95, 1.01, 1.07),   // midtones
                vec3(0.98, 1.02, 1.04),   // highlights
                1.06,                     // saturation
                1.03,                     // contrast
                0.00                      // exposure
            );

            // 1 = SNOW / TUNDRA
            if(biome == 1) return BiomeGrade(
                vec3(0.86, 0.93, 1.12),
                vec3(0.94, 0.98, 1.07),
                vec3(0.99, 1.01, 1.05),
                0.90,
                1.05,
                0.02
            );

            // 2 = DESERT
            // More "piss filter": yellow-heavy mids/highlights, slightly dusty shadows
            if(biome == 2) return BiomeGrade(
                vec3(1.00, 1.02, 0.92),
                vec3(1.12, 1.10, 0.82),
                vec3(1.15, 1.12, 0.84),
                1.12,
                1.10,
                0.02
            );

            // 3 = FOREST
            // Natural, rich, but not green vomit
            if(biome == 3) return BiomeGrade(
                vec3(0.95, 1.01, 0.97),
                vec3(0.99, 1.03, 0.98),
                vec3(1.02, 1.02, 0.98),
                1.05,
                1.04,
                -0.005
            );

            // 4 = PLAINS
            // Neutral anchor biome, only very slight warmth
            if(biome == 4) return BiomeGrade(
                vec3(0.99, 0.995, 1.00),
                vec3(1.01, 1.01, 1.00),
                vec3(1.02, 1.015, 1.00),
                1.02,
                1.02,
                0.00
            );

            // 5 = TAIGA
            // Colder and darker than snow, blue-green chill
            if(biome == 5) return BiomeGrade(
                vec3(0.87, 0.95, 1.10),
                vec3(0.93, 0.98, 1.06),
                vec3(0.98, 1.00, 1.04),
                0.92,
                1.05,
                -0.01
            );

            // 6 = COLD_DESERT
            // Dry and cold, pale, slightly bluish
            if(biome == 6) return BiomeGrade(
                vec3(0.89, 0.95, 1.09),
                vec3(0.98, 0.99, 1.03),
                vec3(1.01, 1.01, 1.03),
                0.88,
                1.06,
                0.005
            );

            // 7 = SAVANNA
            // More orange/golden than desert, less yellow-green
            if(biome == 7) return BiomeGrade(
                vec3(1.00, 0.99, 0.96),
                vec3(1.12, 1.05, 0.88),
                vec3(1.16, 1.07, 0.89),
                1.10,
                1.08,
                0.015
            );

            // 8 = RAINFOREST
            // Humid, lush, slightly cool in shadows
            if(biome == 8) return BiomeGrade(
                vec3(0.90, 1.02, 1.00),
                vec3(0.95, 1.07, 0.99),
                vec3(0.99, 1.03, 0.98),
                1.12,
                1.03,
                -0.01
            );

            // 9 = SNOW_DESERT
            // Very cold, very bright, very desaturated
            if(biome == 9) return BiomeGrade(
                vec3(0.84, 0.91, 1.14),
                vec3(0.92, 0.97, 1.08),
                vec3(1.00, 1.01, 1.05),
                0.82,
                1.07,
                0.03
            );

            return BiomeGrade(vec3(1.0), vec3(1.0), vec3(1.0), 1.0, 1.0, 0.0);
        }

        void applyBiomeGrade(inout vec3 color)
        {
            vec3 originalColor = color;
            BiomeGrade a = getBiomeGrade(int(biomegrade.x + 0.5)), b = getBiomeGrade(int(biomegrade.y + 0.5));
            BiomeGrade g;
            g.shadows = a.shadows * biomegrade.z + b.shadows * biomegrade.w;
            g.midtones = a.midtones * biomegrade.z + b.midtones * biomegrade.w;
            g.highlights = a.highlights * biomegrade.z + b.highlights * biomegrade.w;
            g.saturation = a.saturation * biomegrade.z + b.saturation * biomegrade.w;
            g.contrast = a.contrast * biomegrade.z + b.contrast * biomegrade.w;
            g.exposure = a.exposure * biomegrade.z + b.exposure * biomegrade.w;

            float luma = dot(color, vec3(0.2126, 0.7152, 0.0722));
            float shadowMask = 1.0 - smoothstep(0.18, 0.48, luma);
            float highlightMask = smoothstep(0.58, 0.92, luma);
            float midMask = max(0.0, 1.0 - shadowMask - highlightMask);
            float maskSum = shadowMask + midMask + highlightMask;
            
            if(maskSum > 0.0001)
            {
                shadowMask /= maskSum;
                midMask /= maskSum;
                highlightMask /= maskSum;
            }

            vec3 tonalTint = g.shadows * shadowMask + g.midtones * midMask + g.highlights * highlightMask;

            color *= tonalTint;
            float lum = dot(color, vec3(0.2126, 0.7152, 0.0722));
            color = mix(vec3(lum), color, g.saturation);
            color = (color - 0.5) * g.contrast + 0.5;
            color *= exp2(g.exposure);
            color = mix(originalColor, color, biomelutparams.x);
        }
    ]
]

hdrtonemapdefs = [
    result [
        uniform vec4 hdrparams;
        uniform vec2 hdrgamma;
        varying vec2 texcoord0, texcoord1;
        flat varying float lumscale;
        flat varying vec2 lumsaturate;
        @(biomelutdefs)
    ]
]

hdrtonemapshaders = [
  (? $arg1 lazyshader shader) 0 [hdrnop@arg1] [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0; 
    }
  ] [
    @arg2
    uniform sampler2DRect tex0;
    @(biomelutdefs)
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec3 color = texture2DRect(tex0, texcoord0).rgb;
        applyBiomeGrade(color);
        fragcolor.rgb = color;
        @arg4
        @(? $arg3 $arg3 [fragcolor.a = 0.0;])
    }
  ]

  (? $arg1 lazyshader shader) 0 [hdrtonemap@arg1] (hdrtonemapvertexshader) [
    @arg2
    uniform sampler2DRect tex0, tex1;
    @(hdrtonemapdefs)
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec3 bloom = texture2DRect(tex1, texcoord1).rgb*hdrparams.w;
        vec3 color = texture2DRect(tex0, texcoord0).rgb*2.0;
        color += bloom;
        @(hdrgammadecode color)
        @(hdrtonemapfrag color)
        @(hdrgammaencode color)
        fragcolor.rgb = color;
        @arg4
        @(? $arg3 $arg3 [fragcolor.a = 0.0;])
    }
  ]

  if $msaasamples [msaatonemapshaders $arg1 $arg2 $arg3 $arg4]
  if (= $msaasamples 2) [msaasplitshaders $arg1 $arg2 $arg3 $arg4]
]

msaatonemapshaders = [
  if (=s $arg1 "") [lazyshader 0 [msaatonemapsample] (hdrtonemapvertexshader) [
    #extension GL_ARB_sample_shading : enable
    uniform sampler2DRect tex1;
    uniform sampler2DMS tex0;
    @(hdrtonemapdefs)
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec3 bloom = texture2DRect(tex1, texcoord1).rgb*hdrparams.w;
        vec3 color = texelFetch(tex0, ivec2(texcoord0), gl_SampleID).rgb*2.0;
        color += bloom;
        @(hdrgammadecode color)
        @(hdrtonemapfrag color)
        @(hdrgammaencode color)
        fragcolor = vec4(color, 0.0);
    }
  ]]

  lazyshader 0 [msaatonemap@arg1] (hdrtonemapvertexshader) [
    @arg2
    uniform sampler2DRect tex1;
    uniform sampler2DMS tex0;
    @(hdrtonemapdefs)
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec3 bloom = texture2DRect(tex1, texcoord1).rgb*hdrparams.w;
        vec3 resolved = vec3(0.0);
        for(int sampleidx = 0; sampleidx < @msaasamples; sampleidx++)
        {
            vec3 color = texelFetch(tex0, ivec2(texcoord0), sampleidx).rgb*2.0;
            color += bloom;
            @(hdrgammadecode color)
            @(hdrtonemapfrag color)
            @(hdrgammaencode color)
            resolved += color;
        }
        fragcolor.rgb = resolved * @(divf 1 $msaasamples);
        @arg4
        @(? $arg3 $arg3 [fragcolor.a = 0.0;])
    }
  ]
]

msaasplitshaders = [
  lazyshader 0 [msaatonemapsplit@arg1] (hdrtonemapvertexshader) [
    @arg2
    uniform sampler2DRect tex1;
    uniform sampler2DMS tex0;
    @(hdrtonemapdefs)
    @(loopconcat i $msaasamples [result [
        fragdata(@i) vec4 fragcolor@i;
    ]])
    void main(void)
    {
        vec3 bloom = texture2DRect(tex1, texcoord1).rgb*hdrparams.w;
        @arg4
        @(loopconcat i $msaasamples [result [
            vec3 color@i = texelFetch(tex0, ivec2(texcoord0), @i).rgb*2.0 + bloom;
            @(hdrgammadecode [color@i])
            @(hdrtonemapfrag [color@i])
            @(hdrgammaencode [color@i])
            fragcolor@i.rgb = color@i;
            @(if $arg3 [result [
                @(strreplace $arg3 [fragcolor] [fragcolor@i])
            ]] [result [
                fragcolor@i.a = 0.0;
            ]])
        ]])
    }
  ]
]

hdrtonemapshaders ""
hdrtonemapshaders "luma" [] [fragcolor.a = dot(fragcolor.rgb, vec3(@lumweights));]
hdrtonemapshaders "stencil" [] [fragcolor.a = 1.0;]
hdrtonemapshaders "masked" (if (= $gdepthformat 1) [
    gfetchdefs tex3
] [
    gfetchdefs tex4 $msaasamples
]) [ 
    fragcolor.a = mask;
] (if (= $gdepthformat 1) [result [
    float mask = gfetch(tex3, texcoord0).a;
]] [result [
    float mask = gfetch(tex4, texcoord0).a;
    @(? $msaasamples [mask = step(0.75, mask);])
]])
