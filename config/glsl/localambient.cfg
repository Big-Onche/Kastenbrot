// Camera-local scalar daylight accessibility field used by deferred ambient.

localambientdefs = [
    result [
        uniform sampler3D tex9;
        uniform sampler2D tex15;
        uniform vec3 localambientorigin, localambientscale;
        uniform vec4 localambientparams;
        uniform vec4 localambientgiparams;
        uniform vec4 localambientfarparams;

        float sampleFarLocalAmbient(vec3 worldPos)
        {
            if(localambientfarparams.z < 0.5) return 1.0;
            vec2 size = vec2(textureSize(tex15, 0));
            vec2 tc = (floor(worldPos.xy * localambientfarparams.x * size - 0.5) + 0.5) / size;
            vec2 stepSize = 1.0 / size;
            // Use the lowest surrounding roof: interpolated heights would bury
            // exposed slopes and cliffs. Unknown columns have height zero.
            float roof = min(min(texture2D(tex15, tc).r, texture2D(tex15, tc + vec2(stepSize.x, 0.0)).r),
                             min(texture2D(tex15, tc + vec2(0.0, stepSize.y)).r, texture2D(tex15, tc + stepSize).r));
            float covered = smoothstep(localambientfarparams.y, 2.0 * localambientfarparams.y, roof - worldPos.z);
            return mix(1.0, localambientparams.y, covered);
        }

        vec4 sampleLocalAmbient(vec3 worldPos, vec3 worldNormal)
        {
            vec3 tc = (worldPos - localambientorigin) * localambientscale;

            // One local-ambient cell in texture coordinates.
            vec3 texelSize = 1.0 / vec3(textureSize(tex9, 0));

            // The field represents air accessibility, so sample from the
            // visible air side of the surface instead of inside the solid.
            vec3 n = worldNormal * inversesqrt(max(dot(worldNormal, worldNormal), 1e-8));

            vec4 nearSample = texture3D(
                tex9,
                tc + n * texelSize * 0.55
            );

            vec4 airSample = texture3D(
                tex9,
                tc + n * texelSize
            );

            float skyExposure = max(localambientparams.y, max(nearSample.r, airSample.r));
            vec3 bounce = max(nearSample.gba, airSample.gba);
            // Blend into cached sky cover instead of restoring world ambient
            // unconditionally in distant caves. Keep bounce local.
            vec3 edge = min(tc, 1.0 - tc) / texelSize;
            float coverage = smoothstep(0.0, 2.0, min(edge.x, min(edge.y, edge.z)));
            float farExposure = coverage < 1.0 ? sampleFarLocalAmbient(worldPos) : 1.0;
            return mix(vec4(farExposure, 0.0, 0.0, 0.0), vec4(skyExposure, bounce), coverage);
        }

        float applyLocalAmbient(float skyExposure)
        {
            return mix(1.0, skyExposure, localambientparams.x);
        }
    ]
]
