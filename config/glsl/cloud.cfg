////////////////////////////////////////////////
//
// Voxel clouds
// Flat extruded 2D mask with a single material and soft lighting
// Cloud shadows use a separate low-resolution projected mask with independent opacity and blur
//
////////////////////////////////////////////////

shader 0 "cloud" [
    //:fog
    attribute vec4 vvertex, vnormal;
    uniform mat4 camprojmatrix;
    uniform vec3 cloudmeshoffset;
    varying vec3 cloudnormal, cloudworldpos;
    void main(void)
    {
        cloudworldpos = vvertex.xyz + cloudmeshoffset;
        gl_Position = camprojmatrix * vec4(cloudworldpos, 1.0);
        cloudnormal = normalize(vnormal.xyz * 2.0 - 1.0);
    }
] [
    uniform vec3 cloudsundir, cloudsuncolor, cloudambientcolor, cloudcamera;
    uniform vec3 clouddaytint, cloudsunsettint, cloudnighttint;
    uniform vec4 cloudlighting, cloudappearance, cloudtime;
    varying vec3 cloudnormal, cloudworldpos;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        float day = clamp(cloudtime.x, 0.0, 1.0);
        float sunset = clamp(cloudtime.y, 0.0, 1.0);

        vec3 tint = mix(cloudnighttint, clouddaytint, day);
        tint = mix(tint, cloudsunsettint, sunset);

        vec3 n = normalize(cloudnormal);
        vec3 viewdir = normalize(cloudcamera - cloudworldpos);

        // Fake rounded lighting while the geometry remains deliberately blocky.
        float side = 1.0 - abs(n.z);
        vec3 lightnormal = normalize(vec3(n.xy * (1.0 - cloudappearance.z * 0.35),
                                          n.z + side * cloudappearance.z));

        vec3 sundir = normalize(cloudsundir);
        float ndotl = dot(lightnormal, sundir);
        float wrap = cloudappearance.x;
        float wrapped = max((ndotl + wrap) / (1.0 + wrap), 0.0);
        float face = mix(1.0, 0.38 + 0.62 * wrapped, cloudappearance.y);

        float upward = max(lightnormal.z, 0.0);
        float downward = max(-n.z, 0.0);
        float skyexposure = mix(0.94, 1.07, upward);

        vec3 ambientlight = (vec3(0.055) + cloudambientcolor) * cloudlighting.x * skyexposure;
        vec3 directlight = cloudsuncolor * cloudlighting.y * face;

        float underside = 1.0 - downward * cloudlighting.z;

        float rim = pow(clamp(1.0 - abs(dot(lightnormal, viewdir)), 0.0, 1.0), 2.0);
        vec3 rimlight = cloudsuncolor * rim * cloudappearance.w * mix(0.20, 1.0, day);

        vec3 color = tint * ((ambientlight + directlight) * underside + rimlight);
        color *= cloudtime.z;

        float alpha = clamp(cloudtime.w, 0.0, 1.0);
        fragcolor = vec4(color * alpha, alpha);
    }
]

////////////////////////////////////////////////
// Separable blur
////////////////////////////////////////////////

shader 0 "cloudblur" [
    attribute vec4 vvertex;
    varying vec2 cloudtexcoord;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy, 0.0, 1.0);
        cloudtexcoord = vvertex.xy * 0.5 + 0.5;
    }
] [
    uniform sampler2D tex0;
    uniform vec4 cloudblurdir, cloudblurweights0, cloudblurweights1;
    varying vec2 cloudtexcoord;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec2 d = cloudblurdir.xy;
        vec4 c = texture2D(tex0, cloudtexcoord) * cloudblurweights0.x;
        c += (texture2D(tex0, cloudtexcoord + d) + texture2D(tex0, cloudtexcoord - d)) * cloudblurweights0.y;
        c += (texture2D(tex0, cloudtexcoord + d * 2.0) + texture2D(tex0, cloudtexcoord - d * 2.0)) * cloudblurweights0.z;
        c += (texture2D(tex0, cloudtexcoord + d * 3.0) + texture2D(tex0, cloudtexcoord - d * 3.0)) * cloudblurweights0.w;
        c += (texture2D(tex0, cloudtexcoord + d * 4.0) + texture2D(tex0, cloudtexcoord - d * 4.0)) * cloudblurweights1.x;
        fragcolor = c;
    }
]

shader 0 "cloudcomposite" [
    attribute vec4 vvertex;
    varying vec2 cloudtexcoord;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy, 0.999999, 1.0);
        cloudtexcoord = vvertex.xy * 0.5 + 0.5;
    }
] [
    uniform sampler2D tex0;
    varying vec2 cloudtexcoord;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = texture2D(tex0, cloudtexcoord);
    }
]

////////////////////////////////////////////////
// Dedicated low-resolution projected cloud shadow mask.
////////////////////////////////////////////////

shader 0 "cloudshadowmask" [
    attribute vec4 vvertex;
    uniform vec4 cloudshadowmaskparams;
    void main(void)
    {
        vec2 uv = vvertex.xy * cloudshadowmaskparams.xy + cloudshadowmaskparams.zw;
        gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
    }
] [
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = vec4(1.0);
    }
]

////////////////////////////////////////////////
// Fixed-cost separable blur for the cloud shadow mask.
////////////////////////////////////////////////

shader 0 "cloudshadowblur" [
    attribute vec4 vvertex;
    varying vec2 cloudshadowtexcoord;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy, 0.0, 1.0);
        cloudshadowtexcoord = vvertex.xy * 0.5 + 0.5;
    }
] [
    uniform sampler2D tex0;
    uniform vec4 cloudshadowblurdir, cloudshadowblurweights0, cloudshadowblurweights1;
    varying vec2 cloudshadowtexcoord;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec2 d = cloudshadowblurdir.xy;
        vec4 c = texture2D(tex0, cloudshadowtexcoord) * cloudshadowblurweights0.x;
        c += (texture2D(tex0, cloudshadowtexcoord + d) + texture2D(tex0, cloudshadowtexcoord - d)) * cloudshadowblurweights0.y;
        c += (texture2D(tex0, cloudshadowtexcoord + d * 2.0) + texture2D(tex0, cloudshadowtexcoord - d * 2.0)) * cloudshadowblurweights0.z;
        c += (texture2D(tex0, cloudshadowtexcoord + d * 3.0) + texture2D(tex0, cloudshadowtexcoord - d * 3.0)) * cloudshadowblurweights0.w;
        c += (texture2D(tex0, cloudshadowtexcoord + d * 4.0) + texture2D(tex0, cloudshadowtexcoord - d * 4.0)) * cloudshadowblurweights1.x;
        fragcolor = c;
    }
]

////////////////////////////////////////////////
// Screen-space projection of the cloud mask onto opaque world geometry.
//
// Uses the same g-buffer depth reconstruction macros as Tesseract's deferred
// volumetric shaders. The C++ side applies this with multiplicative blending.
////////////////////////////////////////////////

shader 0 "cloudshadowoverlay" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy, 0.0, 1.0);
    }
] [
    @(gfetchdefs tex3)
    uniform sampler2D tex0;
    uniform mat4 worldmatrix;
    uniform vec3 camera, cloudsundir, cloudshadoworigin;
    uniform vec4 cloudshadowparams;
    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec2 tc = gl_FragCoord.xy;

        @(gdepthunpack depth [gfetch(tex3, tc)] [
            vec3 pos = (worldmatrix * vec4(depth * tc, depth, 1.0)).xyz;
        ] [
            vec4 worldpos = worldmatrix * vec4(tc, depth, 1.0);
            worldpos.xyz /= worldpos.w;
            vec3 pos = worldpos.xyz;
        ])

        float factor = 1.0;

        // cloudshadowparams:
        // x = inverse cloud mask world span
        // y = shadow strength (alpha * direct sunlight)
        // z = maximum shadow distance from camera
        if(cloudsundir.z > 0.01 && pos.z < cloudshadoworigin.z)
        {
            float t = (cloudshadoworigin.z - pos.z) / cloudsundir.z;

            if(t >= 0.0)
            {
                vec2 hitxy = pos.xy + cloudsundir.xy * t;
                vec2 uv = (hitxy - cloudshadoworigin.xy) * cloudshadowparams.x;

                if(uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0)
                {
                    float mask = texture2D(tex0, uv).r;
                    float dist = length(pos.xy - camera.xy);
                    float fade = 1.0 - smoothstep(cloudshadowparams.z * 0.85, cloudshadowparams.z, dist);
                    factor = 1.0 - mask * cloudshadowparams.y * fade;
                }
            }
        }

        fragcolor = vec4(vec3(clamp(factor, 0.0, 1.0)), 1.0);
    }
]
