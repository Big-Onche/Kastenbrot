////////////////////////////////////////////////
//
// Voxel clouds
// Flat extruded 2D mask with a single material and soft lighting
// Cloud shadows use a separate low-resolution projected mask with independent opacity and blur
//
////////////////////////////////////////////////

shader 0 "cloud" [
    attribute vec4 vvertex, vnormal;
    uniform mat4 camprojmatrix;
    uniform vec3 cloudmeshoffset, cloudcamera;
    uniform vec4 clouddomeparams;
    varying vec3 cloudnormal, cloudworldpos;
    varying float cloudundeformedz;
    void main(void)
    {
        cloudworldpos = vvertex.xyz + cloudmeshoffset;
        cloudundeformedz = cloudworldpos.z;
        vec2 domedelta = cloudworldpos.xy - cloudcamera.xy;
        cloudworldpos.z -= dot(domedelta, domedelta) * clouddomeparams.x;
        gl_Position = camprojmatrix * vec4(cloudworldpos, 1.0);
        cloudnormal = normalize(vnormal.xyz * 2.0 - 1.0);
    }
] [
    uniform sampler2D tex0, tex1;
    uniform vec3 cloudsundir, cloudsuncolor, cloudambientcolor, cloudcamera;
    uniform vec3 clouddaytint, cloudsunsettint, cloudnighttint;
    uniform vec4 cloudlighting, cloudappearance, cloudgeometry, cloudvolume, clouddomeparams;
    uniform vec4 cloudraymarch, cloudscatterparams, cloudscreenparams, cloudtime;
    uniform vec4 atmosphereparams;
    uniform vec2 ozoneparams, hdrgamma;
    uniform vec3 mieparams, betarayleigh, betamie, betaozone, atmospheresunlight;
    varying vec3 cloudnormal, cloudworldpos;
    varying float cloudundeformedz;
    fragdata(0) vec4 fragcolor;

    float clouddomedrop(vec2 pos)
    {
        vec2 delta = pos - cloudcamera.xy;
        return dot(delta, delta) * clouddomeparams.x;
    }

    vec3 undomecloudpos(vec3 pos)
    {
        pos.z += clouddomedrop(pos.xy);
        pos.z += cloudundeformedz - cloudworldpos.z - clouddomedrop(cloudworldpos.xy);
        return pos;
    }

    vec3 clouddomenormal(vec3 normal, vec2 pos)
    {
        vec2 gradient = 2.0 * clouddomeparams.x * (pos - cloudcamera.xy);
        return normalize(vec3(normal.xy + normal.z * gradient, normal.z));
    }

    float samplecloud(vec3 pos)
    {
        pos = undomecloudpos(pos);
        vec2 uv = (pos.xy - cloudvolume.xy) * cloudvolume.z;
        float edgewidth = min(cloudgeometry.w * 0.25, (cloudgeometry.y - cloudgeometry.x) * 0.25);
        float verticaldensity = smoothstep(cloudgeometry.x, cloudgeometry.x + edgewidth, pos.z) *
            (1.0 - smoothstep(cloudgeometry.y - edgewidth, cloudgeometry.y, pos.z));
        float inside = step(0.0, uv.x) * step(uv.x, 1.0) * step(0.0, uv.y) * step(uv.y, 1.0);

        float halftexel = 0.5 * cloudgeometry.w * cloudvolume.z;
        float density = texture2D(tex0, clamp(uv, vec2(halftexel), vec2(1.0 - halftexel))).r;
        return smoothstep(0.35, 0.65, density) * verticaldensity * inside;
    }

    float samplecloudcell(vec2 cell)
    {
        vec2 masksize = vec2(cloudvolume.w / cloudgeometry.w);
        float inside = step(0.0, cell.x) * step(cell.x, masksize.x - 1.0);
        inside *= step(0.0, cell.y) * step(cell.y, masksize.y - 1.0);
        return texture2D(tex0, clamp((cell + 0.5) / masksize, vec2(0.0), vec2(1.0))).r * inside;
    }

    float cloudroundedsdf(vec3 pos, float radius, out vec3 surfacenormal)
    {
        pos = undomecloudpos(pos);
        float cellsize = cloudgeometry.w;
        vec2 gridpos = (pos.xy - cloudvolume.xy) / cellsize;
        vec2 samplepos = gridpos - 0.5;
        vec2 cell = floor(samplepos);
        vec2 cellblend = samplepos - cell;

        // Restrict interpolation to the requested rounding radius around cell boundaries. Plain bilinear interpolation spans an entire cell and
        // therefore produces nearly the same strong rounding even when cloudrounding is close to zero.
        float blendwidth = clamp(radius / cellsize, 1e-4, 0.49);
        vec2 blendunit = clamp((cellblend - vec2(0.5 - blendwidth)) / (2.0 * blendwidth), vec2(0.0), vec2(1.0));
        vec2 blend = blendunit * blendunit * (3.0 - 2.0 * blendunit);
        vec2 blendderivative = 3.0 * blendunit * (1.0 - blendunit) / blendwidth;

        // Reconstruct the same compact, continuous field on both sides of every cell boundary.
        float density00 = samplecloudcell(cell);
        float density10 = samplecloudcell(cell + vec2(1.0, 0.0));
        float density01 = samplecloudcell(cell + vec2(0.0, 1.0));
        float density11 = samplecloudcell(cell + vec2(1.0, 1.0));
        float density0 = mix(density00, density10, blend.x);
        float density1 = mix(density01, density11, blend.x);
        float density = mix(density0, density1, blend.y);

        vec2 densitygradient = vec2(mix(density10 - density00, density11 - density01, blend.y) * blendderivative.x,
                                    mix(density01 - density00, density11 - density10, blend.x) * blendderivative.y) / cellsize;
        float gradientlength = length(densitygradient);
        float horizontaldistance = gradientlength > 1e-5 ? (0.5 - density) / gradientlength :
            (density >= 0.5 ? -radius : radius);
        horizontaldistance = clamp(horizontaldistance, -cellsize, radius);
        vec2 horizontalnormal = gradientlength > 1e-5 ? -densitygradient / gradientlength : vec2(0.0);

        float zoffset = pos.z - 0.5 * (cloudgeometry.x + cloudgeometry.y);
        float verticaldistance = abs(zoffset) - 0.5 * (cloudgeometry.y - cloudgeometry.x);
        vec2 rounded = vec2(horizontaldistance, verticaldistance) + radius;
        vec2 outside = max(rounded, vec2(0.0));
        float outsidelength = length(outside);
        vec2 weights = outsidelength > 1e-5 ? outside / outsidelength :
            (rounded.x > rounded.y ? vec2(1.0, 0.0) : vec2(0.0, 1.0));
        surfacenormal = normalize(vec3(horizontalnormal * weights.x, (zoffset < 0.0 ? -1.0 : 1.0) * weights.y));
        return outsidelength + min(max(rounded.x, rounded.y), 0.0) - radius;
    }

    float atmospheresphereentry(vec3 origin, vec3 direction, float radius)
    {
        float b = dot(origin, direction);
        float h = b*b - dot(origin, origin) + radius*radius;
        return h > 0.0 ? -b - sqrt(h) : -1.0;
    }

    float atmospheresphereexit(vec3 origin, vec3 direction, float radius)
    {
        float b = dot(origin, direction);
        float h = b*b - dot(origin, origin) + radius*radius;
        return h > 0.0 ? max(-b + sqrt(h), 0.0) : 0.0;
    }

    vec3 atmosphericdensity(vec3 position)
    {
        float altitude = max(length(position) - 1.0, 0.0);
        float rayleigh = exp(-altitude / max(atmosphereparams.z, 1e-7));
        float mie = exp(-altitude / max(atmosphereparams.w, 1e-7));
        float ozone = max(1.0 - abs(altitude - ozoneparams.x) / max(ozoneparams.y, 1e-7), 0.0);
        return vec3(rayleigh, mie, ozone);
    }

    vec3 atmospheresunlightdepth(vec3 origin, vec3 sundir)
    {
        if(atmospheresphereentry(origin, sundir, 1.0) > 1e-5) return vec3(-1.0);

        float raylength = atmospheresphereexit(origin, sundir, atmosphereparams.y);
        vec3 opticaldepth = vec3(0.0);
        for(int i = 0; i < 3; ++i)
        {
            float beginfraction = float(i) / 3.0;
            float endfraction = float(i + 1) / 3.0;
            float segmentbegin = raylength * beginfraction*beginfraction*beginfraction;
            float segmentend = raylength * endfraction*endfraction*endfraction;
            float segmentlength = segmentend - segmentbegin;
            vec3 samplepos = origin + sundir * (0.5 * (segmentbegin + segmentend));
            opticaldepth += atmosphericdensity(samplepos) * segmentlength;
        }
        return opticaldepth * (atmosphereparams.x * cloudscatterparams.x);
    }

    vec3 applyatmosphericscattering(vec3 surfacecolor, vec3 viewdelta, vec3 sundir)
    {
        float viewdistance = length(viewdelta);
        if(viewdistance <= 0.0 || cloudscatterparams.x <= 0.0) return surfacecolor;

        vec3 viewdir = viewdelta / viewdistance;
        vec3 camera = vec3(0.0, 0.0, 1.000001);
        float raylength = min(viewdistance / atmosphereparams.x, atmospheresphereexit(camera, viewdir, atmosphereparams.y));
        vec3 viewdepth = vec3(0.0);
        vec3 rayleighsum = vec3(0.0);
        vec3 miesum = vec3(0.0);

        for(int i = 0; i < 3; ++i)
        {
            float beginfraction = float(i) / 3.0;
            float endfraction = float(i + 1) / 3.0;
            float segmentbegin = raylength * beginfraction;
            float segmentend = raylength * endfraction;
            float segmentlength = segmentend - segmentbegin;
            vec3 samplepos = camera + viewdir * (0.5 * (segmentbegin + segmentend));
            vec3 density = atmosphericdensity(samplepos);
            vec3 segmentdepth = density * (segmentlength * atmosphereparams.x * cloudscatterparams.x);
            vec3 lightdepth = atmospheresunlightdepth(samplepos, sundir);
            if(lightdepth.x >= 0.0)
            {
                vec3 totaldepth = viewdepth + 0.5 * segmentdepth + lightdepth;
                vec3 extinctiondepth = betarayleigh * totaldepth.x + betamie * totaldepth.y + betaozone * totaldepth.z;
                vec3 extinction = exp2(-min(extinctiondepth, vec3(127.0)));
                rayleighsum += extinction * segmentdepth.x;
                miesum += extinction * segmentdepth.y;
            }
            viewdepth += segmentdepth;
        }

        vec3 extinctiondepth = betarayleigh * viewdepth.x + betamie * viewdepth.y + betaozone * viewdepth.z;
        vec3 transmittance = exp2(-min(extinctiondepth, vec3(127.0)));
        float costheta = dot(viewdir, sundir);
        float rayleighphase = (1.5 + 0.5 * costheta * costheta) * (3.0 / (16.0 * 3.14159265));
        float miephase = inversesqrt(mieparams.x + mieparams.y * min(costheta, mieparams.z));
        vec3 inscatter = atmospheresunlight *
            (betarayleigh * rayleighsum * rayleighphase + betamie * miesum * (miephase * miephase * miephase));
        inscatter.b *= cloudscatterparams.y;
        @(hdrgammadecode surfacecolor)
        surfacecolor = surfacecolor * transmittance + inscatter;
        @(hdrgammaencode surfacecolor)
        return surfacecolor;
    }

    void main(void)
    {
        float day = clamp(cloudtime.x, 0.0, 1.0);
        float sunset = clamp(cloudtime.y, 0.0, 1.0);

        float interior = step(0.5, cloudlighting.w);
        vec3 outwardnormal = clouddomenormal(normalize(cloudnormal), cloudworldpos.xy);
        vec3 n = mix(outwardnormal, -outwardnormal, interior);
        vec3 viewdir = normalize(cloudcamera - cloudworldpos);
        vec3 surfacepos = cloudworldpos;

        // Trace from the original planar face into an inset rounded version of the occupied voxel union. This changes the visible contour and
        // supplies the bevel normal without replacing the seeded voxel mask or greedy mesh.
        float roundradius = cloudappearance.z * min(cloudgeometry.w, cloudgeometry.y - cloudgeometry.x) * 0.35;
        if(roundradius > 0.01)
        {
            float traveldistance = 0.0;
            vec3 surfaceviewdir = mix(viewdir, -viewdir, interior);
            float faceincidence = max(dot(outwardnormal, surfaceviewdir), 0.05);
            float maxdimension = max(cloudgeometry.w, cloudgeometry.y - cloudgeometry.x);
            float maxtravel = min(roundradius * 2.5 / faceincidence, maxdimension * 4.0);
            float surfaceepsilon = max(cloudgeometry.w * 0.002, 0.05);
            bool foundsurface = false;
            vec3 roundednormal = n;
            for(int i = 0; i < 24; ++i)
            {
                vec3 candidate = cloudworldpos - surfaceviewdir * traveldistance;
                vec3 candidatenormal;
                float surfacedistance = cloudroundedsdf(candidate - outwardnormal * surfaceepsilon, roundradius, candidatenormal);
                if(surfacedistance <= 0.0)
                {
                    surfacepos = candidate;
                    roundednormal = clouddomenormal(candidatenormal, candidate.xy);
                    foundsurface = true;
                    break;
                }
                traveldistance += max(surfacedistance * 0.75, roundradius / 16.0);
                if(traveldistance > maxtravel) break;
            }
            if(!foundsurface) discard;
            n = mix(roundednormal, -roundednormal, interior);
        }

        vec3 skytint = mix(cloudnighttint, clouddaytint, day);
        vec3 suntint = mix(skytint, cloudsunsettint, sunset);

        vec3 lightnormal = n;

        vec3 sundir = normalize(cloudsundir);
        float epsilon = max(cloudgeometry.w * 0.015, 0.5);

        // A short march from the visible surface into the existing voxel slab estimates how much cloud lies behind this fragment.
        float viewsteps = clamp(floor(cloudraymarch.y + 0.5), 1.0, 32.0);
        float viewsteplen = cloudraymarch.x / viewsteps;
        float viewoccupancy = 0.0;
        for(int i = 0; i < 32; ++i)
        {
            if(float(i) >= viewsteps) break;
            vec3 viewclouddir = mix(-viewdir, viewdir, interior);
            vec3 samplepos = surfacepos + viewclouddir * (epsilon + (float(i) + 0.5) * viewsteplen);
            viewoccupancy += samplecloud(samplepos);
            if(viewoccupancy >= viewsteps - 0.01) break;
        }
        float opticaldepth = 1.0 - exp2(-viewoccupancy * viewsteplen / cloudgeometry.w * 1.25);

        // March toward the sun through the same occupancy texture. Top and sun-facing side fragments leave the mask quickly, while underside and
        // interior-facing fragments accumulate occlusion and fall back toward sky lighting.
        float sunsteps = clamp(floor(cloudraymarch.z + 0.5), 2.0, 16.0);
        float sunsteplen = cloudraymarch.x / sunsteps;
        float sunocclusion = 0.0;
        for(int i = 0; i < 16; ++i)
        {
            if(float(i) >= sunsteps) break;
            vec3 samplepos = surfacepos + sundir * (epsilon + (float(i) + 0.5) * sunsteplen);
            sunocclusion += samplecloud(samplepos);
            if(sunocclusion * sunsteplen / cloudgeometry.w >= 2.5) break;
        }
        float sunvisibility = exp2(-sunocclusion * sunsteplen / cloudgeometry.w * cloudraymarch.w * 2.2);

        float ndotl = dot(lightnormal, sundir);
        float wrapped = max((ndotl + cloudappearance.x) / (1.0 + cloudappearance.x), 0.0);
        float face = mix(0.35 + 0.65 * wrapped, wrapped, cloudappearance.y);

        float downward = max(-n.z, 0.0);
        float skyexposure = mix(0.76, 1.08, lightnormal.z * 0.5 + 0.5);
        float underside = 1.0 - downward * cloudlighting.z;
        float internalambient = mix(1.0, 0.68, opticaldepth * cloudraymarch.w);

        vec3 ambientlight = skytint * (vec3(0.055) + cloudambientcolor) * cloudlighting.x * skyexposure * underside * internalambient;
        vec3 directlight = suntint * cloudsuncolor * cloudlighting.y * face * sunvisibility;

        // A broad Fresnel band supplies the soft edge visible on fair-weather clouds. It becomes a silver lining only when the sun is behind
        // the cloud.
        float rim = pow(clamp(1.0 - abs(dot(lightnormal, viewdir)), 0.0, 1.0), 2.5);
        float backlight = pow(clamp(dot(-viewdir, sundir), 0.0, 1.0), 6.0);
        vec3 rimlight = suntint * cloudsuncolor * rim * cloudappearance.w * sunvisibility * mix(0.25, 1.0 + 1.5 * backlight, day);

        vec3 color = (ambientlight + directlight + rimlight) * cloudtime.z;

        vec3 cameradelta = surfacepos - cloudcamera;
        color = applyatmosphericscattering(color, cameradelta, sundir);

        // cloudalpha is an opaque scene composite rather than geometry transparency. The sampled pixel is the atmosphere or opaque world that was
        // present before clouds rendered, so lowering cloudalpha cannot reveal another cloud face.
        float cloudopacity = clamp(cloudtime.w, 0.0, 1.0);
        if(cloudopacity < 1.0)
        {
            vec2 backgroundcoord = (gl_FragCoord.xy - cloudscreenparams.xy) * cloudscreenparams.zw;
            vec3 background = texture2D(tex1, clamp(backgroundcoord, vec2(0.0), vec2(1.0))).rgb;
            color = mix(background, color, cloudopacity);
        }
        fragcolor = vec4(color, 1.0);
    }
]

////////////////////////////////////////////////
// Separable blur
////////////////////////////////////////////////

shader 0 "cloudblur" [
    attribute vec4 vvertex;
    varying vec2 cloudtexcoord;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy, 0.0, 1.0);
        cloudtexcoord = vvertex.xy * 0.5 + 0.5;
    }
] [
    uniform sampler2D tex0;
    uniform vec4 cloudblurdir, cloudblurweights0, cloudblurweights1;
    varying vec2 cloudtexcoord;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec2 d = cloudblurdir.xy;
        vec4 c = texture2D(tex0, cloudtexcoord) * cloudblurweights0.x;
        c += (texture2D(tex0, cloudtexcoord + d) + texture2D(tex0, cloudtexcoord - d)) * cloudblurweights0.y;
        c += (texture2D(tex0, cloudtexcoord + d * 2.0) + texture2D(tex0, cloudtexcoord - d * 2.0)) * cloudblurweights0.z;
        c += (texture2D(tex0, cloudtexcoord + d * 3.0) + texture2D(tex0, cloudtexcoord - d * 3.0)) * cloudblurweights0.w;
        c += (texture2D(tex0, cloudtexcoord + d * 4.0) + texture2D(tex0, cloudtexcoord - d * 4.0)) * cloudblurweights1.x;
        fragcolor = c;
    }
]

shader 0 "cloudcomposite" [
    attribute vec4 vvertex;
    varying vec2 cloudtexcoord;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy, 0.999999, 1.0);
        cloudtexcoord = vvertex.xy * 0.5 + 0.5;
    }
] [
    uniform sampler2D tex0;
    varying vec2 cloudtexcoord;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = texture2D(tex0, cloudtexcoord);
    }
]

////////////////////////////////////////////////
// Cheap depth-aware fog used only while the camera occupies a cloud cell.
////////////////////////////////////////////////

shader 0 "cloudfog" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy, 0.0, 1.0);
    }
] [
    @(gfetchdefs tex3)
    uniform mat4 worldmatrix;
    uniform vec3 camera, cloudfogcolor;
    uniform vec4 cloudfogparams;
    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec2 tc = gl_FragCoord.xy;

        @(gdepthunpack depth [gfetch(tex3, tc)] [
            vec3 pos = (worldmatrix * vec4(depth * tc, depth, 1.0)).xyz;
        ] [
            vec4 worldpos = worldmatrix * vec4(tc, depth, 1.0);
            worldpos.xyz /= worldpos.w;
            vec3 pos = worldpos.xyz;
        ])

        float fog = (1.0 - exp2(-distance(camera, pos) * cloudfogparams.x)) * cloudfogparams.y;
        fragcolor = vec4(cloudfogcolor, clamp(fog, 0.0, cloudfogparams.y));
    }
]

////////////////////////////////////////////////
// Dedicated low-resolution projected cloud shadow mask.
////////////////////////////////////////////////

shader 0 "cloudshadowmask" [
    attribute vec4 vvertex;
    uniform vec4 cloudshadowmaskparams;
    void main(void)
    {
        vec2 uv = vvertex.xy * cloudshadowmaskparams.xy + cloudshadowmaskparams.zw;
        gl_Position = vec4(uv * 2.0 - 1.0, 0.0, 1.0);
    }
] [
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = vec4(1.0);
    }
]

////////////////////////////////////////////////
// Fixed-cost separable blur for the cloud shadow mask.
////////////////////////////////////////////////

shader 0 "cloudshadowblur" [
    attribute vec4 vvertex;
    varying vec2 cloudshadowtexcoord;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy, 0.0, 1.0);
        cloudshadowtexcoord = vvertex.xy * 0.5 + 0.5;
    }
] [
    uniform sampler2D tex0;
    uniform vec4 cloudshadowblurdir, cloudshadowblurweights0, cloudshadowblurweights1;
    varying vec2 cloudshadowtexcoord;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec2 d = cloudshadowblurdir.xy;
        vec4 c = texture2D(tex0, cloudshadowtexcoord) * cloudshadowblurweights0.x;
        c += (texture2D(tex0, cloudshadowtexcoord + d) + texture2D(tex0, cloudshadowtexcoord - d)) * cloudshadowblurweights0.y;
        c += (texture2D(tex0, cloudshadowtexcoord + d * 2.0) + texture2D(tex0, cloudshadowtexcoord - d * 2.0)) * cloudshadowblurweights0.z;
        c += (texture2D(tex0, cloudshadowtexcoord + d * 3.0) + texture2D(tex0, cloudshadowtexcoord - d * 3.0)) * cloudshadowblurweights0.w;
        c += (texture2D(tex0, cloudshadowtexcoord + d * 4.0) + texture2D(tex0, cloudshadowtexcoord - d * 4.0)) * cloudshadowblurweights1.x;
        fragcolor = c;
    }
]

////////////////////////////////////////////////
// Screen-space projection of the cloud mask onto opaque world geometry.
//
// Uses the same g-buffer depth reconstruction macros as Tesseract's deferred
// volumetric shaders. The C++ side applies this with multiplicative blending.
////////////////////////////////////////////////

shader 0 "cloudshadowoverlay" [
    attribute vec4 vvertex;
    void main(void)
    {
        gl_Position = vec4(vvertex.xy, 0.0, 1.0);
    }
] [
    @(gfetchdefs tex3)
    uniform sampler2D tex0;
    uniform mat4 worldmatrix;
    uniform vec3 camera, cloudsundir, cloudshadoworigin;
    uniform vec4 cloudshadowparams;
    fragdata(0) vec4 fragcolor;

    void main(void)
    {
        vec2 tc = gl_FragCoord.xy;

        @(gdepthunpack depth [gfetch(tex3, tc)] [
            vec3 pos = (worldmatrix * vec4(depth * tc, depth, 1.0)).xyz;
        ] [
            vec4 worldpos = worldmatrix * vec4(tc, depth, 1.0);
            worldpos.xyz /= worldpos.w;
            vec3 pos = worldpos.xyz;
        ])

        float factor = 1.0;

        // cloudshadowparams:
        // x/w = inverse cloud mask world span in X/Y
        // y = shadow strength (alpha * direct sunlight)
        // z = maximum shadow distance from camera
        if(cloudsundir.z > 0.01 && pos.z < cloudshadoworigin.z)
        {
            float t = (cloudshadoworigin.z - pos.z) / cloudsundir.z;

            if(t >= 0.0)
            {
                vec2 hitxy = pos.xy + cloudsundir.xy * t;
                vec2 uv = (hitxy - cloudshadoworigin.xy) * cloudshadowparams.xw;

                if(uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0)
                {
                    float mask = texture2D(tex0, uv).r;
                    float dist = length(pos.xy - camera.xy);
                    float fade = 1.0 - smoothstep(cloudshadowparams.z * 0.85, cloudshadowparams.z, dist);
                    factor = 1.0 - mask * cloudshadowparams.y * fade;
                }
            }
        }

        fragcolor = vec4(vec3(clamp(factor, 0.0, 1.0)), 1.0);
    }
]
