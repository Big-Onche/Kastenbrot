///////////////////////////////////////////////////
//
// used for rendering to the HUD
//
///////////////////////////////////////////////////

shader 0 "hud" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        fragcolor = colorscale * color;
    }
]

shader 0 "hudgrass" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        color.rgb += color.a * (vec3(104.0, 145.0, 70.0) / 255.0);
        color.a = 1.0;
        fragcolor = colorscale * color;
    }
]

shader 0 "hudtext" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 glyph = texture2D(tex0, texcoord0);
        fragcolor = vec4(colorscale.rgb * glyph.r, colorscale.a * glyph.a);
    }
]

shader 0 "hudrgb" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        fragcolor.rgb = colorscale.rgb * color.rgb;
        fragcolor.a   = colorscale.a;
    }
]

// Inventory glass uses real UI transparency and an analytical backlight to
// show normal-map refraction without invoking the world refraction pass.
shader 0 "hudglass" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0;
    uniform vec4 glasspreviewparams; // opacity, distortion, gloss, quality
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec3 normal = normalize(texture2D(tex0, texcoord0).rgb * 2.0 - 1.0);
        vec2 refracted = texcoord0 + normal.xy * (0.055 * glasspreviewparams.y);

        // A broad white source illuminates the whole normal map. Refraction
        // moves its smooth hotspot, while directional transmission exposes the
        // surface relief without adding artificial stripes.
        vec2 lightdelta = refracted - vec2(0.54, 0.46);
        float hotspot = 1.0 - smoothstep(0.12, 0.78, length(lightdelta));
        vec2 reliefdir = normalize(vec2(-0.58, 0.72));
        float relief = clamp(0.56 + dot(normal.xy, reliefdir) * 0.62 + (normal.z - 0.82) * 0.55, 0.05, 1.0);
        float backlight = (0.56 + hotspot * 0.34) * mix(0.52, 1.12, relief);
        vec3 transmission = vec3(0.48, 0.76, 1.0) * backlight;

        vec3 viewdir = normalize(vec3((vec2(0.5) - texcoord0) * 0.85, 1.35));
        vec3 lightdir = normalize(vec3(-0.72, 0.58, 1.0));
        float ndoth = max(dot(normal, normalize(viewdir + lightdir)), 0.0);
        float exponent = mix(10.0, 82.0, glasspreviewparams.z);
        float highlight = pow(ndoth, exponent) * mix(0.20, 0.92, glasspreviewparams.z);
        vec2 glintdelta = (texcoord0 - vec2(0.70, 0.24)) * vec2(1.0, 1.35);
        float glint = pow(clamp(1.0 - dot(glintdelta, glintdelta) * 8.0, 0.0, 1.0), 6.0);
        highlight += glint * mix(0.06, 0.24, glasspreviewparams.z);

        float fresnel = pow(1.0 - max(dot(normal, viewdir), 0.0), 2.0);
        float border = smoothstep(0.34, 0.49, max(abs(texcoord0.x - 0.5), abs(texcoord0.y - 0.5)));
        vec3 qualitytint = mix(vec3(0.035, 0.13, 0.22), vec3(0.01, 0.055, 0.11), glasspreviewparams.w);
        vec3 rimlight = vec3(0.58, 0.84, 1.0) * border * (0.34 + fresnel * 0.26);
        fragcolor.rgb = (transmission + qualitytint + fresnel * 0.08) * colorscale.rgb + rimlight + vec3(highlight);
        fragcolor.a = clamp(glasspreviewparams.x + border * 0.20 + relief * 0.07 + fresnel * 0.12 + highlight * 0.12,
                            0.14, 0.76) * colorscale.a;
    }
]

shader 0 "hudgrayscale" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2D tex0;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        float luminance = dot(color.rgb, vec3(0.299, 0.587, 0.114));
        fragcolor = vec4(vec3(luminance) * colorscale.rgb, color.a * colorscale.a);
    }
]

shader 0 "hudnotexture" [
    attribute vec4 vvertex, vcolor;
    uniform mat4 hudmatrix;
    varying vec4 color;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        color = vcolor;
    }
] [
    varying vec4 color;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = color;
    }
]

shader 0 "hudrect" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0; 
        colorscale = vcolor;
    }
] [
    uniform sampler2DRect tex0;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = colorscale * texture2DRect(tex0, texcoord0);
    }
]

lazyshader 0 "hudcsm" [
    attribute vec4 vvertex;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
    }
] [
    @(? (< $glslversion 130) [
        #extension GL_EXT_texture_array : require
    ])
    uniform sampler2DArray tex0;
    uniform float csmlayer;
    varying vec2 texcoord0;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        #if __VERSION__ < 130
            float depth = texture2DArray(tex0, vec3(texcoord0, csmlayer)).r;
        #else
            float depth = texture(tex0, vec3(texcoord0, csmlayer)).r;
        #endif
        fragcolor = vec4(vec3(depth), 1.0);
    }
]

shader 0 "hud3d" [
    attribute vec4 vvertex, vcolor;
    attribute vec3 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec3 texcoord0;
    varying vec4 color;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        color = vcolor;
    }
] [
    uniform sampler3D tex0;
    varying vec3 texcoord0;
    varying vec4 color;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        fragcolor = color * texture3D(tex0, texcoord0);
    }
]

shader 0 "hudcubemap" [
    attribute vec4 vvertex, vcolor;
