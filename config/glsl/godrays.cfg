// Backlit cloud-edge source. This is an auxiliary pass over the existing cloud mesh;
// it does not alter the cloud renderer or its visible output.
lazyshader 0 "cloudraysource" [
    attribute vec4 vvertex, vnormal;
    uniform mat4 camprojmatrix;
    uniform vec3 cloudmeshoffset, cloudcamera;
    uniform vec4 clouddomeparams;
    varying vec3 cloudnormal, cloudworldpos;
    void main(void)
    {
        cloudworldpos = vvertex.xyz + cloudmeshoffset;
        vec2 domedelta = cloudworldpos.xy - cloudcamera.xy;
        cloudworldpos.z -= dot(domedelta, domedelta) * clouddomeparams.x;
        cloudnormal = normalize(vnormal.xyz * 2.0 - 1.0);
        gl_Position = camprojmatrix * vec4(cloudworldpos, 1.0);
    }
] [
    uniform vec3 cloudcamera, cloudsundir;
    uniform vec4 cloudtime;
    varying vec3 cloudnormal, cloudworldpos;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec3 viewdir = normalize(cloudcamera - cloudworldpos);
        float rim = pow(clamp(1.0 - abs(dot(normalize(cloudnormal), viewdir)), 0.0, 1.0), 2.0);
        float backlight = pow(clamp(dot(-viewdir, normalize(cloudsundir)), 0.0, 1.0), 6.0);
        float source = rim * backlight * clamp(cloudtime.w, 0.0, 1.0);
        fragcolor = vec4(source, source, source, 1.0);
    }
]

lazyshader 0 "crepuscularrays" [
    attribute vec4 vvertex;
    void main(void) { gl_Position = vvertex; }
] [
    uniform sampler2DRect tex0;
    uniform vec4 crsource, crrayscale, crsun, crvariationparams, crvariationparams2;
    fragdata(0) vec4 fragcolor;

    float crhash(vec3 p)
    {
        p = fract(p * vec3(0.1031, 0.1030, 0.0973));
        p += dot(p, p.yxz + 33.33);
        return fract((p.x + p.y) * p.z);
    }

    float crnoise(vec3 p)
    {
        vec3 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(crhash(i), crhash(i + vec3(1, 0, 0)), u.x),
                       mix(crhash(i + vec3(0, 1, 0)), crhash(i + vec3(1, 1, 0)), u.x), u.y),
                   mix(mix(crhash(i + vec3(0, 0, 1)), crhash(i + vec3(1, 0, 1)), u.x),
                       mix(crhash(i + vec3(0, 1, 1)), crhash(i + vec3(1)), u.x), u.y), u.z);
    }

    float sourceat(vec2 p)
    {
        if(any(lessThan(p, vec2(0.5))) || any(greaterThan(p, crsource.xy - vec2(0.5)))) return 0.0;
        return texture2DRect(tex0, p).r;
    }

    void main(void)
    {
        vec2 pixel = (gl_FragCoord.xy - vec2(0.5)) * crrayscale.xy + vec2(0.5);
        float rawsource = sourceat(pixel);
        int steps = int(clamp(crsun.w, 8.0, 64.0));
        vec2 raystep = (crsource.zw - pixel) * (0.96 / float(steps)), samplepixel = pixel;
        float illumination = 1.0, accumulated = 0.0, totalweight = 0.0;
        for(int i = 0; i < 64; ++i)
        {
            if(i >= steps) break;
            samplepixel += raystep;
            accumulated += sourceat(samplepixel) * illumination;
            totalweight += illumination;
            illumination *= 0.965;
        }
        float rays = accumulated / max(totalweight * 0.34, 1.0e-4);

        vec2 delta = pixel - crsource.zw;
        float distancepixels = length(delta), radial = distancepixels / max(crsun.z, 1.0);
        vec2 direction = distancepixels > 1.0e-4 ? delta / distancepixels : vec2(1.0, 0.0);
        float frequency = max(crvariationparams.y, 0.25), detailfrequency = max(crvariationparams.z, frequency);
        float anisotropy = max(crvariationparams.w, 1.0);
        float warp = crnoise(vec3(direction * (2.3 + frequency * 0.04), radial * 1.7) + vec3(4.7, -2.1, 8.3)) - 0.5;
        vec3 primarycoord = vec3(direction * frequency * 0.15915494, radial * frequency / anisotropy);
        primarycoord.xy += vec2(warp, -warp) * crvariationparams2.x * frequency * 0.15915494;
        vec3 detailcoord = vec3(direction * detailfrequency * 0.15915494,
                                radial * detailfrequency / max(anisotropy * 0.72, 1.0));
        float layered = mix(crnoise(primarycoord + vec3(11, -17, 3)), crnoise(detailcoord + vec3(-23, 9, 19)), 0.28);
        float halfwidth = 0.5 / max(crvariationparams2.y, 0.25);
        float band = smoothstep(0.5 - halfwidth, 0.5 + halfwidth, layered);
        float radialgate = smoothstep(0.16, 0.72, radial) * (1.0 - smoothstep(2.5, 5.5, radial));
        radialgate = pow(clamp(radialgate, 0.0, 1.0), max(crvariationparams2.z, 0.1));
        float gate = smoothstep(0.012, 0.20, max(rays, rawsource * 0.75)) * crsun.y;
        rays *= mix(1.0, mix(0.68, 1.32, band), clamp(crvariationparams.x, 0.0, 1.0) * radialgate * gate);
        fragcolor = vec4(rawsource, accumulated / max(totalweight, 1.0e-4), band, rays);
    }
]

lazyshader 0 "crepuscularrayscomposite" [
    attribute vec4 vvertex;
    void main(void) { gl_Position = vvertex; }
] [
    uniform sampler2DRect tex0;
    @(gfetchdefs tex8 $msaalight ngfetch)
    uniform vec4 crcompositeparams, crtint;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec2 tc = clamp(gl_FragCoord.xy * crcompositeparams.zw, vec2(0.5), crcompositeparams.xy - vec2(0.5));
        float rays = texture2DRect(tex0, tc).a;
        vec4 normal = ngfetch(tex8, gl_FragCoord.xy);
        rays *= 1.0 - step(1.0e-6, dot(normal.rgb, normal.rgb));
        fragcolor = vec4(max(crtint.rgb, vec3(0.0)) * rays * max(crtint.w, 0.0), 0.0);
    }
]

lazyshader 0 "crepuscularraysdebug" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        colorscale = vcolor;
    }
] [
    uniform sampler2DRect tex0;
    uniform int crdebugchannel;
    varying vec2 texcoord0;
    varying vec4 colorscale;
    fragdata(0) vec4 fragcolor;
    void main(void)
    {
        vec4 stages = texture2DRect(tex0, texcoord0);
        float value = crdebugchannel == 0 ? stages.r :
                      (crdebugchannel == 1 ? stages.g :
                      (crdebugchannel == 2 ? stages.b : stages.a));
        fragcolor = vec4(vec3(value), 1.0) * colorscale;
    }
]

// CSM-driven raymarched shafts cast by world geometry. This remains separate
// from volumetric-cloud crepuscular rays above.
geometrygodraysshader = [
    shader 0 $arg1 [
        attribute vec4 vvertex;

        void main(void)
        {
            gl_Position = vvertex;
        }
    ] [
        @(gfetchdefs tex0 $msaalight)
        uniform sampler2DArrayShadow tex2;
        uniform mat4 shadowworldmatrix;
        uniform vec3 sunDir;
        uniform vec3 sunColor;
        uniform mat3 csmmatrix;
        uniform vec4 csmtransform[8], csmdepth[8];
        uniform vec2 csmdistances[8];
        uniform vec3 csmviewdir;
        uniform vec4 csmbiasparams;
        uniform int csmcount;
        uniform int godRayGeomSteps;
        uniform int godRayGeomDebug;
        uniform vec4 godRayGeomParams;
        uniform vec4 godRayGeomDistanceParams;
        uniform vec4 godRayGeomShapeParams;
        uniform vec2 godRayGeomBiasParams;
        uniform vec2 godRayDepthScale;
        fragdata(0) vec4 fragColor;

        float shadowTap(vec4 tc, vec2 offset)
        {
            vec4 tap = vec4(tc.xy + offset * csmbiasparams.z, tc.zw);
            #if __VERSION__ < 130
                return float(shadow2DArray(tex2, tap));
            #else
                return texture(tex2, tap);
            #endif
        }

        // Keep reconstruction camera-relative, matching Kastenbrot's CSM transforms.
        vec4 getcsmtc(vec3 pos, float distbias, out float coverage)
        {
            float viewdepth = dot(pos, csmviewdir);
            coverage = 0.0;
            vec4 besttc = vec4(0.0);
            for(int i = 0; i < 8; ++i)
            {
                if(i >= csmcount) break;
                if(viewdepth > csmdistances[i].y) continue;
                vec4 transform = csmtransform[i], depthparams = csmdepth[i];
                vec3 lightpos = csmmatrix * pos;
                vec3 tc = vec3(lightpos.xy * transform.z + transform.xy,
                               (lightpos.z - distbias) * depthparams.x + depthparams.y);
                if(any(lessThan(tc, vec3(0.0))) || any(greaterThan(tc, vec3(1.0)))) continue;

                float edgeDistance = min(min(tc.x, tc.y), min(1.0 - tc.x, 1.0 - tc.y));
                float fadeWidth = 0.5 * godRayGeomShapeParams.w;
                float candidate = fadeWidth > 1.0e-4 ? smoothstep(0.0, fadeWidth, edgeDistance) : 1.0;
                // Fade the end of the last cascade too; beyond it, there is no shadow coverage.
                if(i == csmcount - 1 && godRayGeomShapeParams.w > 1.0e-4)
                    candidate *= 1.0 - smoothstep(csmdistances[i].y * (1.0 - godRayGeomShapeParams.w),
                                                  csmdistances[i].y, viewdepth);
                if(candidate > coverage)
                {
                    besttc = vec4(tc.xy, transform.w, tc.z);
                    coverage = candidate;
                }
                if(coverage >= 0.999) break;
            }
            return besttc;
        }

        float filterSunShadow(vec4 tc)
        {
            vec2 pixel = tc.xy / csmbiasparams.z;
            vec2 offset = fract(pixel - 0.5);
            vec4 center = vec4(tc.xy - offset * (0.5 * csmbiasparams.z), tc.zw);
            vec4 size = vec4(offset + 1.0, 2.0 - offset);
            return (1.0 / 9.0) * dot(size.zxzx * size.wwyy,
                                    vec4(shadowTap(center, vec2(-0.5, -0.5)), shadowTap(center, vec2(1.0, -0.5)),
                                         shadowTap(center, vec2(-0.5, 1.0)), shadowTap(center, vec2(1.0, 1.0))));
        }

        vec2 sampleSunVisibility(vec3 pos, float distbias)
        {
            float coverage;
            vec4 tc = getcsmtc(pos, distbias, coverage);
            if(coverage <= 0.0) return vec2(0.0);
            return vec2(clamp(filterSunShadow(tc), 0.0, 1.0) * coverage, coverage);
        }

        vec2 sampleSunVisibilityRaw(vec3 pos, float distbias)
        {
            float coverage;
            vec4 tc = getcsmtc(pos, distbias, coverage);
            if(coverage <= 0.0) return vec2(0.0);
            return vec2(clamp(shadowTap(tc, vec2(0.0)), 0.0, 1.0) * coverage, coverage);
        }

        vec2 sampleLocalIsolation(vec3 pos, float distbias, float centerVisibility, vec3 axisX, vec3 axisY, float radius)
        {
            vec2 sampleX0 = sampleSunVisibilityRaw(pos - axisX*radius, distbias);
            vec2 sampleX1 = sampleSunVisibilityRaw(pos + axisX*radius, distbias);
            vec2 sampleY0 = sampleSunVisibilityRaw(pos - axisY*radius, distbias);
            vec2 sampleY1 = sampleSunVisibilityRaw(pos + axisY*radius, distbias);
            vec4 neighborhoodOcclusion = max(vec4(sampleX0.y - sampleX0.x, sampleX1.y - sampleX1.x,
                                                  sampleY0.y - sampleY0.x, sampleY1.y - sampleY1.x), 0.0);
            float averageOcclusion = dot(neighborhoodOcclusion, vec4(0.25));
            float strongestOcclusion = max(max(neighborhoodOcclusion.x, neighborhoodOcclusion.y),
                                           max(neighborhoodOcclusion.z, neighborhoodOcclusion.w));
            float secondaryOcclusion = max(dot(neighborhoodOcclusion, vec4(1.0)) - strongestOcclusion, 0.0);
            float surroundingSupport = clamp(secondaryOcclusion/max(strongestOcclusion, 1.0e-4), 0.0, 1.0);
            return vec2(centerVisibility * averageOcclusion, surroundingSupport);
        }

        vec3 debugHeat(float value)
        {
            return value < 0.5 ? mix(vec3(0.0, 0.0, 1.0), vec3(0.0, 1.0, 0.0), value*2.0) :
                                 mix(vec3(0.0, 1.0, 0.0), vec3(1.0, 0.0, 0.0), (value - 0.5)*2.0);
        }

        void main(void)
        {
            vec2 depthTexCoord = gl_FragCoord.xy * godRayDepthScale;
            @(gdepthunpack sceneDepth [gfetch(tex0, depthTexCoord)] [
                vec3 scenePos = (shadowworldmatrix * vec4(sceneDepth*depthTexCoord, sceneDepth, 1.0)).xyz;
            ] [
                vec4 scenePos4 = shadowworldmatrix * vec4(depthTexCoord, sceneDepth, 1.0);
                vec3 scenePos = scenePos4.xyz / scenePos4.w;
            ])

            vec3 rayVector = scenePos;
            float sceneDistance = length(rayVector);
            if(sceneDistance <= 1.0e-4 || csmcount <= 0)
            {
                fragColor = vec4(0.0);
                return;
            }

            vec3 viewDirection = rayVector / sceneDistance;
            float maxDistance = min(sceneDistance, godRayGeomParams.z);
            int stepCount = clamp(godRayGeomSteps, 1, 64);
            float stepCountF = float(stepCount);
            float stepSize = maxDistance / stepCountF;
            if(stepSize <= 1.0e-5)
            {
                fragColor = vec4(0.0);
                return;
            }

            float farFadeStart = godRayGeomParams.z * 0.35;
            float sunView = clamp(dot(viewDirection, sunDir)*0.5 + 0.5, 0.0, 1.0);
            float forwardScatter = mix(0.30, 1.0, pow(sunView, max(godRayGeomParams.w, 0.25)));
            float rayIntensity = max(godRayGeomParams.x, 0.25) * 0.16 * clamp(godRayGeomDistanceParams.x, 0.0, 2.0);
            float dither = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
            float runningVisibility = 0.10;
            float runningBlend = clamp(1.0 - godRayGeomParams.y, 1.0/64.0, 1.0);
            float baseAtmosphereAccum = 0.0;
            float shaftBoostAccum = 0.0;
            vec3 isolationReference = abs(sunDir.z) < 0.99 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
            vec3 isolationAxisX = normalize(cross(sunDir, isolationReference));
            vec3 isolationAxisY = normalize(cross(sunDir, isolationAxisX));
            float isolationRadius = max(godRayGeomShapeParams.z, 0.0);
            float visibilityAccum = 0.0;
            float isolationAccum = 0.0;
            float coverageAccum = 0.0;
            float biasAccum = 0.0;

            for(int stepIndex = 0; stepIndex < 64; ++stepIndex)
            {
                if(stepIndex >= stepCount) break;

                float sampleDistance = (float(stepIndex) + dither) * stepSize;
                vec3 samplePos = viewDirection * sampleDistance;
                float distanceWeight = 1.0 - smoothstep(farFadeStart, godRayGeomParams.z, sampleDistance);
                float biasDistanceWeight = clamp(sampleDistance/max(godRayGeomParams.z, 1.0), 0.0, 1.0);
                float biasAmount = godRayGeomBiasParams.x + godRayGeomBiasParams.y*biasDistanceWeight;
                vec2 visibilityCoverage = sampleSunVisibility(samplePos, biasAmount);
                float visibility = visibilityCoverage.x;
                float excess = max(visibility - runningVisibility, 0.0);
                runningVisibility = mix(runningVisibility, visibility, runningBlend * visibilityCoverage.y);
                float baseAtmosphereContrib = visibility * godRayGeomShapeParams.x;
                vec2 localIsolation = sampleLocalIsolation(samplePos, biasAmount, visibility, isolationAxisX, isolationAxisY, isolationRadius);
                float isolationSupport = mix(0.15, 1.0, smoothstep(0.0, 1.0, localIsolation.y));
                float isolationMask = pow(localIsolation.x, max(godRayGeomDistanceParams.w, 0.25)) * isolationSupport;
                float shaftBoostContrib = visibility * isolationMask * godRayGeomDistanceParams.y;
                float detailBoostContrib = pow(excess, 0.70) * pow(visibility, 0.80) * visibilityCoverage.y * isolationMask *
                                           godRayGeomDistanceParams.z;
                baseAtmosphereAccum += baseAtmosphereContrib * distanceWeight;
                shaftBoostAccum += (shaftBoostContrib + detailBoostContrib) * distanceWeight;
                if(godRayGeomDebug != 0)
                {
                    visibilityAccum += visibility;
                    isolationAccum += isolationMask;
                    coverageAccum += visibilityCoverage.y;
                    biasAccum += biasAmount;
                }
            }

            float accumScale = max(stepCountF*0.25, 1.0e-4);
            float baseAtmosphereSignal = clamp(baseAtmosphereAccum/accumScale, 0.0, 1.0);
            float shaftBoostSignal = clamp(shaftBoostAccum/accumScale, 0.0, 1.0);
            float threshold = clamp(godRayGeomShapeParams.y, 0.0, 0.99);
            shaftBoostSignal = max((shaftBoostSignal - threshold)/max(1.0 - threshold, 1.0e-3), 0.0);
            shaftBoostSignal = smoothstep(0.0, 1.0, pow(shaftBoostSignal, 0.85));
            float volumetricSignal = clamp(baseAtmosphereSignal + shaftBoostSignal, 0.0, 1.0);
            if(godRayGeomDebug != 0)
            {
                float sampleScale = 1.0/max(stepCountF, 1.0);
                float coverage = coverageAccum * sampleScale;
                vec3 debugColor = vec3(0.0);
                if(godRayGeomDebug == 1) debugColor = vec3(visibilityAccum * sampleScale);
                else if(godRayGeomDebug == 2) debugColor = vec3(baseAtmosphereSignal);
                else if(godRayGeomDebug == 3) debugColor = vec3(shaftBoostSignal);
                else if(godRayGeomDebug == 4) debugColor = vec3(volumetricSignal);
                else if(godRayGeomDebug == 5) debugColor = vec3(1.0 - coverage, coverage, 0.0);
                else if(godRayGeomDebug == 6) debugColor = debugHeat(clamp(biasAccum*sampleScale*0.5, 0.0, 1.0));
                else if(godRayGeomDebug == 7) debugColor = vec3(isolationAccum * sampleScale);
                fragColor = vec4(debugColor, dot(debugColor, vec3(0.2126, 0.7152, 0.0722)));
                return;
            }
            vec3 rayColor = sunColor * (rayIntensity * forwardScatter * volumetricSignal);
            float rayLuma = dot(rayColor, vec3(0.2126, 0.7152, 0.0722));
            rayColor *= 1.0/(1.0 + 4.0*rayLuma);
            fragColor = vec4(rayColor, volumetricSignal);
        }
    ]
]

geometrygodraysshader "geometrygodrays"

geometrygodraysdepthguideshader = [
    shader 0 $arg1 [
        attribute vec4 vvertex;
        @(screentexcoord 0)
        varying vec2 depthTexCoord;

        void main(void)
        {
            gl_Position = vvertex;
            depthTexCoord = vtexcoord0;
        }
    ] [
        @(gfetchdefs tex0 $msaalight)
        @(? $arg2 [] [uniform vec3 gdepthpackparams;])
        varying vec2 depthTexCoord;
        @(? $arg2 [fragdata(0) float fragDepth;] [fragdata(0) vec4 fragColor;])

        void main(void)
        {
            @(gdepthunpack sceneDepth [gfetch(tex0, depthTexCoord)])
            @(if $arg2 [result [
                fragDepth = sceneDepth;
            ]] [result [
                @(gpackdepth packedDepth sceneDepth)
                fragColor = vec4(packedDepth, 1.0);
            ]])
        }
    ]
]

geometrygodraysdepthguideshader "geometrygodraysdepthguide" 0
geometrygodraysdepthguideshader "geometrygodraysdepthguidefloat" 1

geometrygodraysatrousshader = [
    shader 0 $arg1 [
        attribute vec4 vvertex;

        void main(void)
        {
            gl_Position = vvertex;
        }
    ] [
        uniform sampler2DRect tex0;
        uniform sampler2DRect tex1;
        @(? $arg2 [] [uniform vec3 gdepthunpackparams;])
        uniform vec2 aTrousSize;
        uniform vec4 aTrousParams;
        fragdata(0) vec4 fragColor;

        float aTrousKernel(int kernelIndex)
        {
            if(kernelIndex <= 0) return 0.375;
            if(kernelIndex == 1) return 0.25;
            return 0.0625;
        }

        float fetchGuideDepth(vec2 sampleCoord)
        {
            return @(? $arg2 [texture2DRect(tex1, sampleCoord).r] [dot(texture2DRect(tex1, sampleCoord).rgb, gdepthunpackparams)]);
        }

        float relativeDepthDiff(float sampleDepth, float centerDepth)
        {
            return abs(sampleDepth - centerDepth)/max(max(abs(sampleDepth), abs(centerDepth)), 1.0);
        }

        void main(void)
        {
            vec2 pixelCoord = gl_FragCoord.xy;
            vec4 centerValue = texture2DRect(tex0, pixelCoord);
            float centerDepth = fetchGuideDepth(pixelCoord);
            float dilation = max(aTrousParams.x, 1.0);
            float signalStrength = max(aTrousParams.y, 0.0);
            float depthStrength = max(aTrousParams.z, 0.0);
            const float centerWeight = 0.140625;
            vec4 accumValue = centerValue * centerWeight;
            float totalWeight = centerWeight;

            for(int offsetY = -2; offsetY <= 2; ++offsetY)
            {
                int absOffsetY = offsetY < 0 ? -offsetY : offsetY;
                float weightY = aTrousKernel(absOffsetY);
                for(int offsetX = -2; offsetX <= 2; ++offsetX)
                {
                    if(offsetX == 0 && offsetY == 0) continue;
                    int absOffsetX = offsetX < 0 ? -offsetX : offsetX;
                    float weightX = aTrousKernel(absOffsetX);
                    vec2 sampleCoord = clamp(pixelCoord + vec2(float(offsetX), float(offsetY))*dilation, vec2(0.5), aTrousSize - vec2(0.5));
                    vec4 sampleValue = texture2DRect(tex0, sampleCoord);
                    float depthDiff = relativeDepthDiff(fetchGuideDepth(sampleCoord), centerDepth);
                    float signalDiff = abs(sampleValue.a - centerValue.a);
                    float edgeWeight = exp(-depthDiff*depthDiff*depthStrength - signalDiff*signalDiff*signalStrength);
                    float sampleWeight = weightX * weightY * edgeWeight;
                    accumValue += sampleValue * sampleWeight;
                    totalWeight += sampleWeight;
                }
            }

            fragColor = accumValue/max(totalWeight, 1.0e-5);
        }
    ]
]

