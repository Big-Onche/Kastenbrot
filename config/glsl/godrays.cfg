geometrygodraysupsampleshader = [
shader 0 $arg1 [
    attribute vec4 vvertex;

    void main(void)
    {
        gl_Position = vvertex;
    }
] [
    uniform sampler2DRect tex0;
    @(gfetchdefs tex1 $msaalight)
    @(? $arg2 [
        uniform sampler2DRect tex2;
    ])
    uniform vec4 godrayScale;
    uniform float bilateralDepthScale;
    uniform vec4 viewsize;
    fragdata(0) vec4 fragColor;

    float fetchDepthLinear(vec2 uv)
    {
        @(gdepthunpack depth [gfetch(tex1, uv)])
        return depth;
    }

    @(? $arg2 [
        float fetchGuideDepth(vec2 uv)
        {
            return @(? $arg3 [texture2DRect(tex2, uv).r] [dot(texture2DRect(tex2, uv).rgb, gdepthunpackparams)]);
        }
    ])

    void main(void)
    {
        vec2 uv = gl_FragCoord.xy;
        float centerDepth = fetchDepthLinear(uv);
        vec2 srcSize = max(floor(viewsize.xy*godrayScale.zw + vec2(0.5)), vec2(1.0));
        vec2 srcF = uv*godrayScale.zw - vec2(0.5);
        vec2 base = floor(srcF);
        vec2 fracP = fract(srcF);
        vec2 maxPixel = srcSize - vec2(1.0);
        vec2 pixel00 = clamp(base, vec2(0.0), maxPixel);
        vec2 pixel10 = clamp(base + vec2(1.0, 0.0), vec2(0.0), maxPixel);
        vec2 pixel01 = clamp(base + vec2(0.0, 1.0), vec2(0.0), maxPixel);
        vec2 pixel11 = clamp(base + vec2(1.0), vec2(0.0), maxPixel);
        vec2 sampleUV00 = pixel00 + vec2(0.5);
        vec2 sampleUV10 = pixel10 + vec2(0.5);
        vec2 sampleUV01 = pixel01 + vec2(0.5);
        vec2 sampleUV11 = pixel11 + vec2(0.5);
        float depthThreshold = max(abs(centerDepth)*bilateralDepthScale, 1.0);
        @(? $arg2 [
            // These representatives use the same full-resolution coordinates as the old per-tap depth fetches.
            @(? (&& $arg3 $usetexgather) [
                vec4 gatheredDepth = textureGather(tex2, base + vec2(1.0));
                vec4 tapDepth = vec4(gatheredDepth.w, gatheredDepth.z, gatheredDepth.x, gatheredDepth.y);
            ] [
                vec4 tapDepth = vec4(fetchGuideDepth(sampleUV00), fetchGuideDepth(sampleUV10), fetchGuideDepth(sampleUV01),
                                     fetchGuideDepth(sampleUV11));
            ])
        ] [
            vec2 minDepthUV = vec2(0.5);
            vec2 maxDepthUV = viewsize.xy - vec2(0.5);
            vec2 depthUV00 = clamp(sampleUV00*godrayScale.xy, minDepthUV, maxDepthUV);
            vec2 depthUV10 = clamp(sampleUV10*godrayScale.xy, minDepthUV, maxDepthUV);
            vec2 depthUV01 = clamp(sampleUV01*godrayScale.xy, minDepthUV, maxDepthUV);
            vec2 depthUV11 = clamp(sampleUV11*godrayScale.xy, minDepthUV, maxDepthUV);
            vec4 tapDepth = vec4(fetchDepthLinear(depthUV00), fetchDepthLinear(depthUV10), fetchDepthLinear(depthUV01),
                                 fetchDepthLinear(depthUV11));
        ])
        vec4 depthErr = abs(tapDepth - centerDepth)/depthThreshold;
        vec4 spatialWeight = vec4((1.0 - fracP.x)*(1.0 - fracP.y), fracP.x*(1.0 - fracP.y),
                                  (1.0 - fracP.x)*fracP.y, fracP.x*fracP.y);
        vec4 validWeight = vec4(spatialWeight.x > 1.0e-6 && depthErr.x <= 3.0 ? 1.0 : 0.0,
                                spatialWeight.y > 1.0e-6 && depthErr.y <= 3.0 ? 1.0 : 0.0,
                                spatialWeight.z > 1.0e-6 && depthErr.z <= 3.0 ? 1.0 : 0.0,
                                spatialWeight.w > 1.0e-6 && depthErr.w <= 3.0 ? 1.0 : 0.0);
        vec4 weights = spatialWeight*exp(-depthErr*depthErr)*validWeight;
        vec4 color00 = texture2DRect(tex0, sampleUV00);
        vec4 color10 = texture2DRect(tex0, sampleUV10);
        vec4 color01 = texture2DRect(tex0, sampleUV01);
        vec4 color11 = texture2DRect(tex0, sampleUV11);
        vec4 accum = color00*weights.x + color10*weights.y + color01*weights.z + color11*weights.w;
        float totalWeight = dot(weights, vec4(1.0));

        if(totalWeight > 1.0e-5)
        {
            fragColor = accum/totalWeight;
            return;
        }

        vec4 fallbackDepthErr = vec4(spatialWeight.x > 1.0e-6 ? depthErr.x : 1.0e16,
                                     spatialWeight.y > 1.0e-6 ? depthErr.y : 1.0e16,
                                     spatialWeight.z > 1.0e-6 ? depthErr.z : 1.0e16,
                                     spatialWeight.w > 1.0e-6 ? depthErr.w : 1.0e16);
        float bestDepthErr = min(min(fallbackDepthErr.x, fallbackDepthErr.y), min(fallbackDepthErr.z, fallbackDepthErr.w));
        if(bestDepthErr > 3.0) fragColor = vec4(0.0);
        else if(bestDepthErr == fallbackDepthErr.x) fragColor = color00;
        else if(bestDepthErr == fallbackDepthErr.y) fragColor = color10;
        else if(bestDepthErr == fallbackDepthErr.z) fragColor = color01;
        else fragColor = color11;
    }
]
]

